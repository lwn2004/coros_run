<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Running Dashboard</title>

<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="preconnect" href="https://unpkg.com">
<link rel="preconnect" href="https://wprd01.is.autonavi.com">

<style>
    :root {
        --bg-color: #000000;
        --card-bg: #1a1a1a;
        --text-main: #ffffff;
        --text-muted: #888888;
        --text-dark: #666666;
        --accent-red: #e93342;
        --border-color: #2a2a2a;
        --progress-bg: #2c2c2e;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        padding: 24px;
        min-height: 100vh;
    }

    .container { max-width: 1200px; margin: 0 auto; }
    .main-layout { display: flex; gap: 24px; }
    .column-left { flex: 3; display: flex; flex-direction: column; gap: 24px; }
    .column-right { flex: 2; display: flex; flex-direction: column; gap: 24px; }

    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .card { background-color: var(--card-bg); border-radius: 12px; padding: 20px; border: 1px solid var(--border-color); }
    .card-title { color: var(--text-muted); font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
    .card-value { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
    .card-value span { font-size: 14px; color: var(--text-muted); font-weight: normal; }

    .progress-container { width: 100%; height: 4px; background-color: var(--progress-bg); border-radius: 2px; margin-bottom: 16px; overflow: hidden; }
    .progress-bar { height: 100%; background-color: var(--accent-red); width: 0%; border-radius: 2px; transition: width 0.8s ease-out; }
    .sub-stats { display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: var(--text-muted); }
    .stat-row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
    .stat-row.left-aligned { justify-content: flex-start; }
    .icon { color: var(--accent-red); font-style: normal; }
    .trend-down { color: var(--text-muted); }
    .trend-up { color: var(--accent-red); }

    .map-card { background-color: var(--card-bg); border-radius: 16px; overflow: hidden; border: 1px solid var(--border-color); height: 450px; }
    #map { width: 100%; height: 100%; }

    .calendar-card { background-color: var(--card-bg); border-radius: 16px; padding: 24px; border: 1px solid var(--border-color); }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .calendar-title-group { display: flex; align-items: baseline; gap: 12px; }
    .calendar-month { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
    .calendar-month-dist { color: var(--text-muted); font-size: 13px; }
    .calendar-nav { display: flex; gap: 4px; }
    .calendar-nav-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; padding: 4px 10px; border-radius: 6px; transition: background 0.2s; }
    .calendar-nav-btn:hover { background-color: #2c2c2e; color: white; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; text-align: center; }
    .calendar-weekday { color: var(--text-dark); font-weight: 600; font-size: 11px; padding-bottom: 8px; }
    
    /* 优化项 3：日历格子改为1:1圆角矩形 */
    .calendar-day { 
        position: relative; 
        width: 100%;
        aspect-ratio: 1 / 1; /* 严格保持 1:1 宽高比 */
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        border-radius: 8px; /* 圆角矩形 */
        cursor: pointer; 
        color: var(--text-dark); 
        transition: all 0.2s; 
    }
    .calendar-day.current-month-day { color: #a1a1a1; }
    .calendar-day.has-run { background-color: #2c2c2e; color: white; }
    .calendar-day.has-run.long-run { background-color: var(--accent-red); }
    .calendar-day.selected { outline: 2px solid white; outline-offset: 1px; }
    .calendar-day-num { font-weight: 600; font-size: 13px; }
    .calendar-day-dist { font-size: 9px; opacity: 0.8; margin-top: 1px; }

    .activity-section { background-color: var(--card-bg); border-radius: 12px; padding: 20px; border: 1px solid var(--border-color); }
    .activity-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .activity-title { font-size: 20px; font-weight: 700; }
    .activity-count { color: var(--text-dark); font-size: 13px; }
    
    /* 优化项 2：支持左右滑动拨动，隐藏多余框外内容 */
    .filters { 
        display: flex; 
        gap: 8px; 
        margin-bottom: 24px; 
        overflow-x: auto; /* 支持横向平滑滚动 */
        white-space: nowrap; 
        scrollbar-width: none; /* Firefox 隐藏滚动条 */
        -webkit-overflow-scrolling: touch; /* iOS 弹性滚动 */
    }
    .filters::-webkit-scrollbar { display: none; } /* Chrome/Safari 隐藏滚动条 */
    .filter-btn { flex-shrink: 0; background-color: #2c2c2e; color: var(--text-muted); border: none; padding: 6px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .filter-btn.active { background-color: var(--accent-red); color: white; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    th { color: var(--text-dark); font-weight: 600; padding-bottom: 16px; font-size: 11px; letter-spacing: 0.5px; }
    td { white-space: nowrap; padding: 16px 0; color: #d1d1d1; transition: background-color 0.2s; }
    tr.active-row td { background-color: rgba(233, 51, 66, 0.12) !important; color: #ffffff !important; }
    tr.active-row td.bold-white { color: var(--accent-red) !important; }
    .bold-white { color: white; font-weight: 600; }
    .unit { color: var(--text-dark); font-size: 11px; font-weight: normal; }
    .pagination { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; color: var(--text-muted); font-size: 13px; padding-top: 16px; border-top: 1px solid var(--border-color); }
    .page-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; }

    @media (max-width: 768px) {
        body { padding: 12px; }
        .main-layout { display: flex; flex-direction: column; gap: 16px; }
        .column-left, .column-right { display: contents; }
        .summary-grid { order: 1; }
        .map-card { order: 2; height: 250px; position: sticky; top: 0px; z-index: 1000; box-shadow: 0 10px 20px rgba(0,0,0,0.5);}
        .calendar-card { order: 3; }
        .activity-section { 
            order: 4; 
            position: sticky; 
            top: 266px; /* 0px(屏幕顶距) + 250px(地图高) + 16px(模块间距) */
            height: calc(100vh - 278px); /* 100vh - 顶部占用(266) - body底部padding(12) */
            display: flex; 
            flex-direction: column;
            padding-bottom: 0; /* 底部留白交给内部滚动区 */
            z-index: 990; /* 确保它上滑时盖过日历 */
        }
      .table-scroll-area {
            flex: 1;
            overflow-y: auto;
            margin: 0 -20px; /* 负边距抵消父容器的 padding，让滚动区域贴边 */
            padding: 0 20px; /* 恢复内部内容的对齐 */
            -webkit-overflow-scrolling: touch; /* 保证 iOS 顺滑回弹滚动 */
        }

        /* (可选) 隐藏滚动区的滚动条，让界面更干净 */
        .table-scroll-area::-webkit-scrollbar {
            display: none;
        }

        /* 3. 表头在独立滚动区内吸顶，加上背景色防止下方数据划过时文字穿透重叠 */
        th {
            position: sticky;
            top: 0;
          padding-bottom: 6px;
            background-color: var(--card-bg);
            z-index: 10;
        }
          td { padding: 6px 0;}
        .summary-grid { grid-template-columns: repeat(2, 1fr); }
        .summary-grid .card:first-child { display: none; }
        .mobile-hide { display: none; }
        .card-value { font-size: 18px; }
        .compare-info { font-size: 10px; }
    }    
</style>

<body>

<div class="container">
    <div class="main-layout">
        <div class="column-left">
            <div class="summary-grid">
                <div class="card">
                    <div class="card-title">TOTAL DISTANCE</div>
                    <div class="card-value" id="total-distance">0.00 <span>/ 40000km</span></div>
                    <div class="progress-container"><div class="progress-bar" id="total-progress"></div></div>
                    <div class="sub-stats">
                        <div class="stat-row left-aligned"><span class="icon">⚡</span> <span id="total-runs">0</span> runs</div>
                        <div class="stat-row left-aligned"><span class="icon">⏱</span> <span id="total-duration">0h 0m</span></div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">YEARLY GOAL</div>
                    <div class="card-value" id="yearly-dist">0.00 <span>/ 2400 km</span></div>
                    <div class="progress-container"><div class="progress-bar" id="yearly-progress"></div></div>
                    <div class="sub-stats">
                        <div class="stat-row mobile-hide"><span><span id="yearly-runs">0</span> runs</span><span id="yearly-duration">0h 0m</span></div>
                        <div class="stat-row left-aligned compare-info" id="yearly-vs-container"></div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">MONTHLY GOAL</div>
                    <div class="card-value" id="monthly-dist">0.00 <span>/ 200 km</span></div>
                    <div class="progress-container"><div class="progress-bar" id="monthly-progress"></div></div>
                    <div class="sub-stats">
                        <div class="stat-row mobile-hide"><span><span id="monthly-runs">0</span> runs</span><span id="monthly-duration">0h 0m</span></div>
                        <div class="stat-row left-aligned compare-info" id="monthly-vs-container"></div>
                    </div>
                </div>
            </div>

            <div class="activity-section">
                <div class="activity-header">
                    <div class="activity-title">Activity Log</div>
                    <div class="activity-count" id="showing-text">Showing 1-16 of 0</div>
                </div>

                <div class="filters" id="year-filters">
                    <button class="filter-btn active" data-year="all">All</button>
                    <button class="filter-btn" data-year="2026">2026</button>
                    <button class="filter-btn" data-year="2025">2025</button>
                    <button class="filter-btn" data-year="2024">2024</button>
                    <button class="filter-btn" data-year="2023">2023</button>
                    <button class="filter-btn" data-year="2022">2022</button>
                    <button class="filter-btn" data-year="2021">2021</button>
                </div>
              <div class="table-scroll-area">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 25%">DATE</th>
                            <th class="mobile-hide" style="width: 15%">NAME</th>
                            <th style="width: 15%">DISTANCE</th>
                            <th class="mobile-hide" style="width: 15%">DURATION</th>
                            <th style="width: 15%">PACE</th>
                            <th style="width: 15%">HR</th>
                        </tr>
                    </thead>
                  <div class="table-scroll-area">
                    <tbody id="table-body"></tbody>
                  </div>
                </table>

                <div class="pagination">
                    <button class="page-btn" id="prev-page">&lt;</button>
                    <span id="page-info">Page 1 of 1</span>
                    <button class="page-btn" id="next-page">&gt;</button>
                </div>
              </div>
            </div>
        </div>

        <div class="column-right">
            <div class="map-card"><div id="map"></div></div>
            <div class="calendar-card" id="calendar-card"></div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/gumblex/leaflet.ChineseCRS/leaflet.ChineseCRS.js"></script>
<script src="https://unpkg.com/@mapbox/polyline"></script>

<script>
    let map;
    let routeLayer; 
    let allRuns = [];
    let filteredRuns = [];
    let currentPage = 1;
    const itemsPerPage = 10;
    let currentYearFilter = 'all';

    // 优化项 1：全局初始化时间动态获取
    const systemDate = new Date();
    let calendarYear = systemDate.getFullYear();
    let calendarMonth = systemDate.getMonth() + 1; 
    let selectedCalendarDate = null; 

    const GOAL_TOTAL = 40000;
    const GOAL_YEARLY = 2400;
    const GOAL_MONTHLY = 200;

    function initMap() {
        map = L.map('map', {
            zoomControl: false,
			attributionControl: false,
            crs: L.ChineseCRS.CRS_GCJ02_3857 
        }).setView([23.1, 113.3], 12);

        setTimeout(() => {
            L.tileLayer(
                'https://wprd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=6&x={x}&y={y}&z={z}',
                { subdomains: ['1', '2', '3', '4'], overlay: true }
            ).addTo(map);
        }, 300);
    }

    function renderMap(runsOrRun) {
        if (!map) return;
        let runs = Array.isArray(runsOrRun) ? runsOrRun : (runsOrRun ? [runsOrRun] : []);

        try {
            if (routeLayer) map.removeLayer(routeLayer);
            routeLayer = L.featureGroup().addTo(map);
            let hasValidCoords = false;

            if (runs.length > 1) {
                const multiLatlngs = [];
                runs.forEach(run => {
                    if (run && run._cachedLatlngs && run._cachedLatlngs.length > 0) {
                        multiLatlngs.push(run._cachedLatlngs);
                    }
                });

                if (multiLatlngs.length > 0) {
                    L.polyline(multiLatlngs, { color: '#ff1744', weight: 2, opacity: 0.4 }).addTo(routeLayer);
                    hasValidCoords = true;
                }
            } else if (runs.length === 1) {
                const run = runs[0];
                if (run && run._cachedLatlngs && run._cachedLatlngs.length > 0) {
                    L.polyline(run._cachedLatlngs, { color: '#ff1744', weight: 4, opacity: 0.9 }).addTo(routeLayer);
                    hasValidCoords = true;
                }
            }

            if (hasValidCoords) map.fitBounds(routeLayer.getBounds(), { padding: [20, 20] });
        } catch (e) {}
    }

    function parseMovingTime(timeStr) {
        if (!timeStr) return 0;
        const parts = timeStr.split('.')[0].split(':');
        let seconds = 0;
        if (parts.length === 3) {
            seconds += parseInt(parts[0], 10) * 3600;
            seconds += parseInt(parts[1], 10) * 60;
            seconds += parseInt(parts[2], 10);
        } else if (parts.length === 2) {
            seconds += parseInt(parts[0], 10) * 60;
            seconds += parseInt(parts[1], 10);
        }
        return seconds;
    }

    function formatHoursMins(totalSeconds) {
        const hours = Math.floor(totalSeconds / 3600);
        const mins = Math.floor((totalSeconds % 3600) / 60);
        return `${hours}h ${mins}m`;
    }

    // 优化项 1：统计卡片时间动态计算
    function calculateSummaries() {
        const now = new Date();
        const currentYear = now.getFullYear().toString();
        const currentMonth = `${currentYear}-${(now.getMonth() + 1).toString().padStart(2, '0')}`;
        const lastYearPrefix = (now.getFullYear() - 1).toString();
        
        // 动态精准计算上个月年份和月份前缀
        let lmYear = now.getFullYear();
        let lmMonth = now.getMonth(); 
        if (lmMonth === 0) { lmMonth = 12; lmYear--; }
        const lastMonthPrefix = `${lmYear}-${lmMonth.toString().padStart(2, '0')}`;
        
        const sameDayMD = `${(now.getMonth() + 1).toString().padStart(2, '0')}-${now.getDate().toString().padStart(2, '0')}`;
        const sameDayD = now.getDate().toString().padStart(2, '0');

        let totalDist = 0, totalSeconds = 0, totalRunsCount = allRuns.length;
        let yearlyDist = 0, yearlySeconds = 0, yearlyRunsCount = 0, lastYearSamePeriodDist = 0;
        let monthlyDist = 0, monthlySeconds = 0, monthlyRunsCount = 0, lastMonthSamePeriodDist = 0;

        allRuns.forEach(run => {
            const distKm = (run.distance || 0) / 1000;
            const seconds = parseMovingTime(run.moving_time);
            const dateStr = run.start_date_local || "";

            totalDist += distKm;
            totalSeconds += seconds;

            if (dateStr.startsWith(currentYear)) {
                yearlyDist += distKm;
                yearlySeconds += seconds;
                yearlyRunsCount++;
            }
            if (dateStr.startsWith(lastYearPrefix)) {
                const md = dateStr.substring(5, 10);
                if (md <= sameDayMD) lastYearSamePeriodDist += distKm;
            }
            if (dateStr.startsWith(currentMonth)) {
                monthlyDist += distKm;
                monthlySeconds += seconds;
                monthlyRunsCount++;
            }
            if (dateStr.startsWith(lastMonthPrefix)) {
                const d = dateStr.substring(8, 10);
                if (d <= sameDayD) lastMonthSamePeriodDist += distKm;
            }
        });

        document.getElementById('total-distance').innerHTML = `${totalDist.toFixed(2)} <span>/ ${GOAL_TOTAL} km</span>`;
        document.getElementById('total-progress').style.width = `${Math.min(100, (totalDist / GOAL_TOTAL) * 100)}%`;
        document.getElementById('total-runs').innerText = totalRunsCount;
        document.getElementById('total-duration').innerText = formatHoursMins(totalSeconds);

        document.getElementById('yearly-dist').innerHTML = `${yearlyDist.toFixed(2)} <span>/ ${GOAL_YEARLY} km</span>`;
        document.getElementById('yearly-progress').style.width = `${Math.min(100, (yearlyDist / GOAL_YEARLY) * 100)}%`;
        document.getElementById('yearly-runs').innerText = yearlyRunsCount;
        document.getElementById('yearly-duration').innerText = formatHoursMins(yearlySeconds);
        
        const yearlyVs = yearlyDist - lastYearSamePeriodDist;
        const yearlyVsContainer = document.getElementById('yearly-vs-container');
        if (yearlyVs >= 0) {
            yearlyVsContainer.className = "stat-row left-aligned compare-info trend-up";
            yearlyVsContainer.innerHTML = `↗ ${yearlyVs.toFixed(0)} km vs 去年同期`;
        } else {
            yearlyVsContainer.className = "stat-row left-aligned compare-info trend-down";
            yearlyVsContainer.innerHTML = `↘ ${Math.abs(yearlyVs).toFixed(0)} km vs 去年同期`;
        }

        document.getElementById('monthly-dist').innerHTML = `${monthlyDist.toFixed(2)} <span>/ ${GOAL_MONTHLY} km</span>`;
        document.getElementById('monthly-progress').style.width = `${Math.min(100, (monthlyDist / GOAL_MONTHLY) * 100)}%`;
        document.getElementById('monthly-runs').innerText = monthlyRunsCount;
        document.getElementById('monthly-duration').innerText = formatHoursMins(monthlySeconds);

        const monthlyVs = monthlyDist - lastMonthSamePeriodDist;
        const monthlyVsContainer = document.getElementById('monthly-vs-container');
        if (monthlyVs >= 0) {
            monthlyVsContainer.className = "stat-row left-aligned compare-info trend-up";
            monthlyVsContainer.innerHTML = `↗ ${monthlyVs.toFixed(0)} km vs 上月同期`;
        } else {
            monthlyVsContainer.className = "stat-row left-aligned compare-info trend-down";
            monthlyVsContainer.innerHTML = `↘ ${Math.abs(monthlyVs).toFixed(0)} km vs 上月同期`;
        }
    }

    function initCalendar() {
        const card = document.getElementById('calendar-card');
        card.innerHTML = `
            <div class="calendar-header">
                <div class="calendar-title-group">
                    <div class="calendar-month" id="cal-month-title"></div>
                    <div class="calendar-month-dist" id="cal-month-dist">0 km</div>
                </div>
                <div class="calendar-nav">
                    <button class="calendar-nav-btn" id="cal-prev-btn">&lt;</button>
                    <button class="calendar-nav-btn" id="cal-next-btn">&gt;</button>
                </div>
            </div>
            <div class="calendar-grid" id="cal-grid"></div>
        `;

        document.getElementById('cal-prev-btn').addEventListener('click', () => {
            calendarMonth--;
            if (calendarMonth < 1) { calendarMonth = 12; calendarYear--; }
            renderCalendar();
        });

        document.getElementById('cal-next-btn').addEventListener('click', () => {
            calendarMonth++;
            if (calendarMonth > 12) { calendarMonth = 1; calendarYear++; }
            renderCalendar();
        });

        renderCalendar();
    }

    function renderCalendar() {
        const monthStr = calendarMonth.toString().padStart(2, '0');
        document.getElementById('cal-month-title').innerText = `${monthStr}/${calendarYear}`;

        const dailyData = {};
        let monthTotalDist = 0;
        const prefix = `${calendarYear}-${monthStr}`;

        allRuns.forEach(run => {
            if (run.start_date_local && run.start_date_local.startsWith(prefix)) {
                const dayStr = run.start_date_local.substring(8, 10);
                const dayNum = parseInt(dayStr, 10);
                const km = (run.distance || 0) / 1000;
                dailyData[dayNum] = (dailyData[dayNum] || 0) + km;
                monthTotalDist += km;
            }
        });

        document.getElementById('cal-month-dist').innerText = `${monthTotalDist.toFixed(1)} km`;
        const grid = document.getElementById('cal-grid');
        grid.innerHTML = '';

        const weekdays = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
        weekdays.forEach(w => {
            const div = document.createElement('div');
            div.className = 'calendar-weekday';
            div.innerText = w;
            grid.appendChild(div);
        });

        const firstDayIdx = new Date(calendarYear, calendarMonth - 1, 1).getDay();
        const totalDays = new Date(calendarYear, calendarMonth, 0).getDate();

        // 优化项 3：保持空置格子的长宽比同步
        for (let i = 0; i < firstDayIdx; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.style.aspectRatio = "1 / 1";
            grid.appendChild(emptyCell);
        }

        for (let day = 1; day <= totalDays; day++) {
            const dayCell = document.createElement('div');
            dayCell.className = 'calendar-day current-month-day';
            
            const dateString = `${calendarYear}-${monthStr}-${day.toString().padStart(2, '0')}`;
            if (selectedCalendarDate === dateString) dayCell.classList.add('selected');

            const dayNumDiv = document.createElement('div');
            dayNumDiv.className = 'calendar-day-num';
            dayNumDiv.innerText = day;
            dayCell.appendChild(dayNumDiv);

            if (dailyData[day]) {
                dayCell.classList.add('has-run');
                const dist = dailyData[day];
                if (dist >= 15) dayCell.classList.add('long-run');
                
                const distDiv = document.createElement('div');
                distDiv.className = 'calendar-day-dist';
                distDiv.innerText = dist.toFixed(1);
                dayCell.appendChild(distDiv);
            }

            dayCell.addEventListener('click', () => {
                selectedCalendarDate = (selectedCalendarDate === dateString) ? null : dateString;
                applyFilters(); 
                renderCalendar(); 
            });

            grid.appendChild(dayCell);
        }
    }

    function processAndRenderRuns(data) {
        allRuns = data;
        allRuns.sort((a, b) => new Date(b.start_date_local.replace(/-/g, '/')) - new Date(a.start_date_local.replace(/-/g, '/')));
       
        calculateSummaries();
        initCalendar();
        applyFilters();
		allRuns.forEach(run => {
            if (run.summary_polyline) {
                try {
                    run._cachedLatlngs = polyline.decode(run.summary_polyline);
                } catch (err) {
                    run._cachedLatlngs = [];
                }
            } else {
                run._cachedLatlngs = [];
            }
        });		
		if (!map) initMap(); 
    }

    async function fetchData() {
        const URL = 'https://run.linwn.net/data/activities.json';
        
        try {
            const cache = await caches.open('run-data-cache');
            const cachedResponse = await cache.match(URL);
            
            if (cachedResponse) {
                const cachedData = await cachedResponse.json();
                processAndRenderRuns(cachedData);
            }

            const response = await fetch(URL);
            if (response.ok) {
                const responseToCache = response.clone(); 
                const freshData = await response.json();
                
                if (!cachedResponse || freshData.length !== allRuns.length) {
                    await cache.put(URL, responseToCache); 
                    processAndRenderRuns(freshData);
                }
            }
        } catch (error) {
            console.error('数据拉取失败，尝试使用离线缓存:', error);
        }
    }

    function calculatePace(speedMs) {
        if (!speedMs) return "-";
        const secPerKm = 1000 / speedMs;
        const mins = Math.floor(secPerKm / 60);
        const secs = Math.floor(secPerKm % 60);
        return `${mins}'${secs.toString().padStart(2, '0')}"`;
    }

    function getNameByTime(dateStr) {
        if (!dateStr) return "跑步";
        const parts = dateStr.split(' ');
        if (parts.length < 2) return "跑步";
        const hour = parseInt(parts[1].split(':')[0], 10);
        if (hour >= 4 && hour < 10) return "晨跑";
        if (hour >= 10 && hour < 14) return "上午跑步";
        if (hour >= 14 && hour < 17) return "午后跑步";
        if (hour >= 17 && hour < 20) return "傍晚跑步";
        return "夜跑";
    }

    function formatDuration(timeStr) {
        if (!timeStr) return "0:00:00";
        return timeStr.split('.')[0];
    }

    function renderTable() {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';

        const startIdx = (currentPage - 1) * itemsPerPage;
        const endIdx = startIdx + itemsPerPage;
        const pageData = filteredRuns.slice(startIdx, endIdx);

        pageData.forEach(run => {
            const distKm = (run.distance / 1000).toFixed(2);
            const pace = calculatePace(run.average_speed);
            const duration = formatDuration(run.moving_time);
            const name = run.name || getNameByTime(run.start_date_local);
            const hr = run.average_heartrate ? Math.round(run.average_heartrate) : '-';

            const tr = document.createElement('tr');
            
            if (selectedCalendarDate && run.start_date_local.startsWith(selectedCalendarDate)) {
                tr.className = "active-row";
            }

            tr.innerHTML = `
                <td>${run.start_date_local || ''}</td>
                <td class="bold-white mobile-hide">${name}</td>
                <td><span class="bold-white">${distKm}</span> <span class="unit">km</span></td>
                <td class="mobile-hide">${duration}</td>
                <td>${pace}</td>
                <td>${hr}</td>
            `;
            tr.style.cursor = 'pointer';

            tr.addEventListener('click', () => {
                const runDate = run.start_date_local.substring(0, 10); 
                selectedCalendarDate = runDate;

                const parts = runDate.split('-');
                calendarYear = parseInt(parts[0], 10);
                calendarMonth = parseInt(parts[1], 10);
                renderCalendar(); 

                document.querySelectorAll('#table-body tr').forEach(r => r.classList.remove('active-row'));
                tr.classList.add('active-row');

                renderMap(run);
            });
            tbody.appendChild(tr);
        });

        const totalPages = Math.ceil(filteredRuns.length / itemsPerPage) || 1;
        document.getElementById('page-info').innerText = `Page ${currentPage} of ${totalPages}`;
        
        const showEnd = Math.min(endIdx, filteredRuns.length);
        const showStart = filteredRuns.length === 0 ? 0 : startIdx + 1;
        document.getElementById('showing-text').innerText = `Showing ${showStart}-${showEnd} of ${filteredRuns.length}`;
    }

    function applyFilters() {
        if (currentYearFilter === 'all') {
            filteredRuns = [...allRuns];
        } else {
            filteredRuns = allRuns.filter(run => run.start_date_local && run.start_date_local.startsWith(currentYearFilter));
        }

        if (selectedCalendarDate) {
            const yearMonthPrefix = selectedCalendarDate.substring(0, 7); 
            filteredRuns = allRuns.filter(run => run.start_date_local && run.start_date_local.startsWith(yearMonthPrefix));
            
            const dayRun = allRuns.find(run => run.start_date_local && run.start_date_local.startsWith(selectedCalendarDate));
            if (dayRun) {
                renderMap(dayRun);
            } else {
                renderMap(filteredRuns);
            }
        } else {
            renderMap(filteredRuns);
        }

        currentPage = 1;
        renderTable();
    }

    // 优化项 1：年份按钮点击后，日历自动切到该年的“动态月份”
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentYearFilter = e.target.getAttribute('data-year');
            
            selectedCalendarDate = null; 
            
            const now = new Date();
            if (currentYearFilter !== 'all') {
                calendarYear = parseInt(currentYearFilter, 10);
                // 如果是今年则切到当前月份，如果是历史年份则默认停在 12 月
                calendarMonth = (calendarYear === now.getFullYear()) ? (now.getMonth() + 1) : 12;
            } else {
                calendarYear = now.getFullYear();
                calendarMonth = now.getMonth() + 1;
            }
            
            applyFilters();
            renderCalendar();
        });
    });

    document.getElementById('prev-page').addEventListener('click', () => {
        if (currentPage > 1) { currentPage--; renderTable(); }
    });

    document.getElementById('next-page').addEventListener('click', () => {
        const totalPages = Math.ceil(filteredRuns.length / itemsPerPage);
        if (currentPage < totalPages) { currentPage++; renderTable(); }
    });
// 移动端专属：嵌套滚动（Nested Scroll）交接控制
    const handleMobileNestedScroll = () => {
        if (window.innerWidth <= 768) {
            const activitySection = document.querySelector('.activity-section');
            const tableArea = document.querySelector('.table-scroll-area');
            
            if (activitySection && tableArea) {
                // 266px 是 CSS 中 activity-section 设定的 top 吸顶距离，这里给 1px 容差
                if (activitySection.getBoundingClientRect().top <= 267) {
                    // 容器已吸附到地图底部，允许表格自身开始滑动
                    tableArea.style.overflowY = 'auto';
                } else {
                    // 容器还在随页面上滑途中，强制锁定表格的自身滑动，将手指事件全部交还给整个页面
                    tableArea.style.overflowY = 'hidden';
                }
            }
        }
    };

    // 监听页面的滚动事件（passive 提升滑动性能）
    window.addEventListener('scroll', handleMobileNestedScroll, { passive: true });
    
    // 页面加载或刷新时主动执行一次，防止初始状态错乱
    handleMobileNestedScroll();
    fetchData();
</script>
</body>
</html>
