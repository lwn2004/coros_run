<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Running Dashboard</title>

<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="preconnect" href="https://unpkg.com">
<link rel="preconnect" href="https://wprd01.is.autonavi.com">

<style>
    :root {
        --bg-color: #000000;
        --card-bg: #1a1a1a;
        --text-main: #ffffff;
        --text-muted: #888888;
        --text-dark: #666666;
        --accent-red: #e93342;
        --border-color: #2a2a2a;
        --progress-bg: #2c2c2e;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        padding: 16px;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    .container {
        width: 100%;
        max-width: 1600px;
        margin: 0 auto;
        height: 100%;
        display: flex;
        flex-direction: column;
    }

    .main-layout {
        display: flex;
        gap: 16px;
        flex: 1;
        min-height: 0; /* 关键：允许子元素在弹性盒中缩小 */
    }

    .column-left {
        flex: 1.2;
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-height: 0;
    }

    .column-right {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-height: 0;
    }

    .summary-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        flex-shrink: 0;
    }

    .card {
        background-color: var(--card-bg);
        border-radius: 12px;
        padding: 14px 16px;
        border: 1px solid var(--border-color);
    }

    .card-title {
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 8px;
    }

    .card-value {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 8px;
    }

    .card-value span {
        font-size: 13px;
        color: var(--text-muted);
        font-weight: normal;
    }

    .progress-container {
        width: 100%;
        height: 4px;
        background-color: var(--progress-bg);
        border-radius: 2px;
        margin-bottom: 12px;
        overflow: hidden;
    }

    .progress-bar {
        height: 100%;
        background-color: var(--accent-red);
        width: 0%;
        border-radius: 2px;
        transition: width 0.8s ease-out;
    }

    .sub-stats {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
        color: var(--text-muted);
    }

    .stat-row {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: space-between;
    }

    .stat-row.left-aligned {
        justify-content: flex-start;
    }

    .icon {
        color: var(--accent-red);
        font-style: normal;
    }

    .trend-down {
        color: var(--text-muted);
    }

    .trend-up {
        color: var(--accent-red);
    }

    /* 地图与图表卡片平分右侧空间 */
    .map-card {
        background-color: var(--card-bg);
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid var(--border-color);
        flex: 1;
        min-height: 0;
    }

    #map {
        width: 100%;
        height: 100%;
    }

    .chart-card {
        background-color: var(--card-bg);
        border-radius: 16px;
        padding: 16px;
        border: 1px solid var(--border-color);
        flex: 1.2;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 0;
    }

    .chart-box-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 8px;
        flex-shrink: 0;
    }

    .chart-box-title {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.5px;
    }

    .weather-badge {
        font-size: 12px;
        color: #d1d1d1;
        background-color: #2c2c2e;
        padding: 4px 10px;
        border-radius: 6px;
        display: none;
    }

    .chart-container-wrapper {
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex: 1;
        min-height: 0;
        justify-content: space-between;
    }

    .chart-sub-container {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
    }

    .chart-item {
        position: relative;
        width: 100%;
        flex: 1;
        min-height: 0;
    }

    .chart-sub-title {
        font-size: 11px;
        color: var(--text-dark);
        font-weight: 600;
        text-transform: uppercase;
        margin-bottom: 2px;
        letter-spacing: 0.5px;
    }

    /* 活动表格区域弹性布局 */
    .activity-section {
        background-color: var(--card-bg);
        border-radius: 12px;
        padding: 16px;
        border: 1px solid var(--border-color);
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
    }

    .activity-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        flex-shrink: 0;
    }

    .activity-title {
        font-size: 18px;
        font-weight: 700;
    }

    .activity-count {
        color: var(--text-dark);
        font-size: 12px;
    }
    
    .filters { 
        display: flex; 
        gap: 6px; 
        margin-bottom: 14px; 
        overflow-x: auto; 
        white-space: nowrap; 
        scrollbar-width: none; 
        flex-shrink: 0;
    }
    .filters::-webkit-scrollbar { display: none; } 
    
    .filter-btn { 
        flex-shrink: 0; 
        background-color: #2c2c2e; 
        color: var(--text-muted); 
        border: none; 
        padding: 6px 14px; 
        border-radius: 20px; 
        font-size: 12px; 
        cursor: pointer; 
        transition: all 0.2s; 
    }
    .filter-btn.active { background-color: var(--accent-red); color: white; }

    .table-container {
        flex: 1;
        overflow-y: auto;
        min-height: 0;
    }
    .table-container::-webkit-scrollbar { width: 4px; }
    .table-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    th { color: var(--text-dark); font-weight: 600; padding-bottom: 10px; font-size: 11px; letter-spacing: 0.5px; position: sticky; top: 0; background-color: var(--card-bg); z-index: 1; }
    td { white-space: nowrap; padding: 10px 0; color: #d1d1d1; border-bottom: 1px solid rgba(255,255,255,0.02); }
    tr.active-row td { background-color: rgba(233, 51, 66, 0.12) !important; color: #ffffff !important; }
    tr.active-row td.bold-white { color: var(--accent-red) !important; }
    
    .bold-white { color: white; font-weight: 600; }
    .unit { color: var(--text-dark); font-size: 11px; font-weight: normal; }
    
    .pagination { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-top: 12px; 
        color: var(--text-muted); 
        font-size: 12px; 
        padding-top: 10px; 
        border-top: 1px solid var(--border-color); 
        flex-shrink: 0;
    }
    .page-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; }

    /* ==========================================================================
       手机屏幕/响应式适配代码 (当屏幕宽度小于1024px时生效)
       ========================================================================== */
    @media (max-width: 1024px) {
        body {
            height: auto;
            overflow: auto;
            padding: 12px;
        }

        .container {
            height: auto;
        }

        .main-layout {
            flex-direction: column;
            height: auto;
            overflow: visible;
            gap: 16px;
        }

        .column-left, .column-right {
            flex: none;
            width: 100%;
            height: auto;
        }

        .summary-grid {
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
        }

        .activity-section {
            height: auto;
            min-height: 480px;
        }

        .table-container {
            overflow-x: auto;
            max-height: none;
        }

        .map-card {
            height: 320px;
            flex: none;
        }

        .chart-card {
            height: auto;
            flex: none;
            min-height: 400px;
        }

        .chart-container-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: auto;
        }

        .chart-sub-container {
            flex: none;
            height: auto;
        }

        .chart-item {
            flex: none;
            height: 180px; /* 手机端滚动视图下赋予图表舒适的固定高度 */
        }
    }
</style>

<div class="container">
    <div class="main-layout">
        <div class="column-left">
            <div class="summary-grid">
                <div class="card">
                    <div class="card-title">TOTAL DISTANCE</div>
                    <div class="card-value" id="total-distance">0.00 <span>/ 40000km</span></div>
                    <div class="progress-container"><div class="progress-bar" id="total-progress"></div></div>
                    <div class="sub-stats">
                        <div class="stat-row left-aligned"><span class="icon">⚡</span> <span id="total-runs">0</span> runs</div>
                        <div class="stat-row left-aligned"><span class="icon">⏱</span> <span id="total-duration">0h 0m</span></div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">YEARLY GOAL</div>
                    <div class="card-value" id="yearly-dist">0.00 <span>/ 2400 km</span></div>
                    <div class="progress-container"><div class="progress-bar" id="yearly-progress"></div></div>
                    <div class="sub-stats">
                        <div class="stat-row"><span><span id="yearly-runs">0</span> runs</span><span id="yearly-duration">0h 0m</span></div>
                        <div class="stat-row left-aligned compare-info" id="yearly-vs-container"></div>
                    </div>

                <div class="card">
                    <div class="card-title">MONTHLY GOAL</div>

                    <div class="progress-container"><div class="progress-bar" id="monthly-progress"></div></div>
                    <div class="sub-stats">
                        <div class="stat-row"><span><span id="monthly-runs">0</span> runs</span><span id="monthly-duration">0h 0m</span></div>

            <div class="activity-section">
                <div class="activity-header">

                </div>

                <div class="filters" id="year-filters">
                    <button class="filter-btn active" data-year="all">All</button>
                    <button class="filter-btn" data-year="2026">2026</button>
                    <button class="filter-btn" data-year="2025">2025</button>
                    <button class="filter-btn" data-year="2024">2024</button>
                    <button class="filter-btn" data-year="2023">2023</button>
                    <button class="filter-btn" data-year="2022">2022</button>
                    <button class="filter-btn" data-year="2021">2021</button>
                </div>
                
                <div class="table-container">
                    <table>
                        <thead>

                <div class="pagination">

        <div class="column-right">
            <div class="map-card"><div id="map"></div></div>
            
            <div class="chart-card" id="info-chart-card">
                <div class="chart-box-header">
                    <div class="chart-box-title" id="chart-box-title">Analytics</div>
                    <div class="weather-badge" id="weather-badge"></div>
                </div>
                <div class="chart-container-wrapper" id="chart-container-wrapper">
                    </div>
            </div>
        </div>
    </div>

<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@mapbox/polyline"></script>

<script>
    let map;
    let allRuns = [];
    let filteredRuns = [];
    let currentPage = 1;
    const itemsPerPage = 10;
    let currentYearFilter = 'all';
    let chartInstances = []; 

    const GOAL_TOTAL = 40000;
    const GOAL_YEARLY = 2400;
    const GOAL_MONTHLY = 200;

    // --- WGS84 转 GCJ02 火星坐标算法 ---
    const PI = Math.PI;
    const a_axis = 6378245.0;
    const ee = 0.00669342162296594323;

    function transformLat(x, y) {
        let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(y * PI) + 40.0 * Math.sin(y / 3.0 * PI)) * 2.0 / 3.0;
        ret += (160.0 * Math.sin(y / 12.0 * PI) + 320 * Math.sin(y * PI / 30.0)) * 2.0 / 3.0;
        return ret;
    }

    function transformLon(x, y) {
        let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(x * PI) + 40.0 * Math.sin(x / 3.0 * PI)) * 2.0 / 3.0;
        ret += (150.0 * Math.sin(x / 12.0 * PI) + 300.0 * Math.sin(x / 30.0 * PI)) * 2.0 / 3.0;
        return ret;
    }

    function wgs84ToGcj02(lng, lat) {
        let dLat = transformLat(lng - 105.0, lat - 35.0);
        let dLon = transformLon(lng - 105.0, lat - 35.0);
        let radLat = lat / 180.0 * PI;
        let magic = Math.sin(radLat);
        magic = 1 - ee * magic * magic;
        let sqrtMagic = Math.sqrt(magic);
        dLat = (dLat * 180.0) / ((a_axis * (1 - ee)) / (magic * sqrtMagic) * PI);
        dLon = (dLon * 180.0) / (a_axis / sqrtMagic * Math.cos(radLat) * PI);
        return [lng + dLon, lat + dLat];
    }

    function initMap() {
        map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/dark',
            center: [113.3, 23.1], 
            zoom: 11,
            attributionControl: false
        });
    }

    function renderMap(runsOrRun) {
        if (!map.loaded()) {
            map.once('load', () => { renderMap(runsOrRun); });
            return;
        }

        let runs = Array.isArray(runsOrRun) ? runsOrRun : (runsOrRun ? [runsOrRun] : []);
        let features = [];
        let allCoordinates = [];

        runs.forEach(run => {
            if (run && run._cachedLatlngs && run._cachedLatlngs.length > 0) {
                let geojsonCoords = run._cachedLatlngs.map(coord => [coord[1], coord[0]]);
                features.push({
                    'type': 'Feature',
                    'geometry': { 'type': 'LineString', 'coordinates': geojsonCoords }
                });
                allCoordinates.push(...geojsonCoords);
            }
        });

        const geojsonData = { 'type': 'FeatureCollection', 'features': features };
        const sourceId = 'route-source';
        const layerId = 'route-layer';

        if (map.getSource(sourceId)) {
            map.getSource(sourceId).setData(geojsonData);
        } else {
            map.addSource(sourceId, { 'type': 'geojson', 'data': geojsonData });
            map.addLayer({
                'id': layerId,
                'type': 'line',
                'source': sourceId,
                'layout': { 'line-join': 'round', 'line-cap': 'round' },
                'paint': { 'line-color': '#ff1744', 'line-width': 2, 'line-opacity': 0.4 }
            });
        }

        if (map.getLayer(layerId)) {
            map.setPaintProperty(layerId, 'line-width', runs.length === 1 ? 4 : 2);
            map.setPaintProperty(layerId, 'line-opacity', runs.length === 1 ? 0.9 : 0.4);
        }

        if (features.length > 0) {
            let points = [];
            for (const f of features) {
                if (f.geometry.coordinates.length) {
                    points = f.geometry.coordinates;
                    break;
                }
            }

            if (points.length === 0) {
                map.easeTo({ center: [20, 20], zoom: 3 });
            } else if (points.length === 2 && String(points[0]) === String(points[1])) {
                map.easeTo({ center: points[0], zoom: 9 });
            } else {
                const pointsLong = points.map(point => point[0]);
                const pointsLat = points.map(point => point[1]);
                const bounds = [
                    [Math.min(...pointsLong), Math.min(...pointsLat)],
                    [Math.max(...pointsLong), Math.max(...pointsLat)]
                ];
                map.fitBounds(bounds, { padding: 40, duration: 0 });
                if (features.length > 1) map.setZoom(11);
            }
        }
    }

    function parseMovingTime(timeStr) {
        if (!timeStr) return 0;
        const parts = timeStr.split('.')[0].split(':');
        let seconds = 0;
        if (parts.length === 3) {
            seconds += parseInt(parts[0], 10) * 3600 + parseInt(parts[1], 10) * 60 + parseInt(parts[2], 10);
        } else if (parts.length === 2) {
            seconds += parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
        }
        return seconds;
    }

    function formatHoursMins(totalSeconds) {
        const hours = Math.floor(totalSeconds / 3600);
        const mins = Math.floor((totalSeconds % 3600) / 60);
        return `${hours}h ${mins}m`;
    }

    function calculateSummaries() {
        const now = new Date();
        const currentYear = now.getFullYear().toString();
        const currentMonth = `${currentYear}-${(now.getMonth() + 1).toString().padStart(2, '0')}`;
        const lastYearPrefix = (now.getFullYear() - 1).toString();
        
        let lmYear = now.getFullYear();
        let lmMonth = now.getMonth(); 
        if (lmMonth === 0) { lmMonth = 12; lmYear--; }
        const lastMonthPrefix = `${lmYear}-${lmMonth.toString().padStart(2, '0')}`;
        
        const sameDayMD = `${(now.getMonth() + 1).toString().padStart(2, '0')}-${now.getDate().toString().padStart(2, '0')}`;
        const sameDayD = now.getDate().toString().padStart(2, '0');

        let totalDist = 0, totalSeconds = 0, totalRunsCount = allRuns.length;
        let yearlyDist = 0, yearlySeconds = 0, yearlyRunsCount = 0, lastYearSamePeriodDist = 0;
        let monthlyDist = 0, monthlySeconds = 0, monthlyRunsCount = 0, lastMonthSamePeriodDist = 0;

        allRuns.forEach(run => {
            const distKm = (run.distance || 0) / 1000;
            const seconds = parseMovingTime(run.moving_time);
            const dateStr = run.start_date_local || "";

            totalDist += distKm;
            totalSeconds += seconds;

            if (dateStr.startsWith(currentYear)) {
                yearlyDist += distKm;
                yearlySeconds += seconds;
                yearlyRunsCount++;
            }
            if (dateStr.startsWith(lastYearPrefix)) {
                if (dateStr.substring(5, 10) <= sameDayMD) lastYearSamePeriodDist += distKm;
            }
            if (dateStr.startsWith(currentMonth)) {
                monthlyDist += distKm;
                monthlySeconds += seconds;
                monthlyRunsCount++;
            }
            if (dateStr.startsWith(lastMonthPrefix)) {
                if (dateStr.substring(8, 10) <= sameDayD) lastMonthSamePeriodDist += distKm;
            }
        });

        document.getElementById('total-distance').innerHTML = `${totalDist.toFixed(2)} <span>/ ${GOAL_TOTAL} km</span>`;
        document.getElementById('total-progress').style.width = `${Math.min(100, (totalDist / GOAL_TOTAL) * 100)}%`;
        document.getElementById('total-runs').innerText = totalRunsCount;
        document.getElementById('total-duration').innerText = formatHoursMins(totalSeconds);

        document.getElementById('yearly-dist').innerHTML = `${yearlyDist.toFixed(2)} <span>/ ${GOAL_YEARLY} km</span>`;
        document.getElementById('yearly-progress').style.width = `${Math.min(100, (yearlyDist / GOAL_YEARLY) * 100)}%`;
        document.getElementById('yearly-runs').innerText = yearlyRunsCount;
        document.getElementById('yearly-duration').innerText = formatHoursMins(yearlySeconds);
        
        const yearlyVs = yearlyDist - lastYearSamePeriodDist;
        const yearlyVsContainer = document.getElementById('yearly-vs-container');
        yearlyVsContainer.className = "stat-row left-aligned compare-info " + (yearlyVs >= 0 ? "trend-up" : "trend-down");
        yearlyVsContainer.innerHTML = `${yearlyVs >= 0 ? '↗' : '↘'} ${Math.abs(yearlyVs).toFixed(0)} km vs 去年同期`;

        document.getElementById('monthly-dist').innerHTML = `${monthlyDist.toFixed(2)} <span>/ ${GOAL_MONTHLY} km</span>`;
        document.getElementById('monthly-progress').style.width = `${Math.min(100, (monthlyDist / GOAL_MONTHLY) * 100)}%`;
        document.getElementById('monthly-runs').innerText = monthlyRunsCount;
        document.getElementById('monthly-duration').innerText = formatHoursMins(monthlySeconds);

        const monthlyVs = monthlyDist - lastMonthSamePeriodDist;
        const monthlyVsContainer = document.getElementById('monthly-vs-container');
        monthlyVsContainer.className = "stat-row left-aligned compare-info " + (monthlyVs >= 0 ? "trend-up" : "trend-down");
        monthlyVsContainer.innerHTML = `${monthlyVs >= 0 ? '↗' : '↘'} ${Math.abs(monthlyVs).toFixed(0)} km vs 上月同期`;
    }

    function processAndRenderRuns(data) {
        allRuns = data;
        allRuns.sort((a, b) => new Date(b.start_date_local.replace(/-/g, '/')) - new Date(a.start_date_local.replace(/-/g, '/')));
        allRuns.forEach(run => {
            if (run.summary_polyline) {
                try { run._cachedLatlngs = polyline.decode(run.summary_polyline); } catch (err) { run._cachedLatlngs = []; }
            } else { run._cachedLatlngs = []; }
        });       
        calculateSummaries();
        if (!map) initMap(); 		
        applyFilters();		
    }

    async function fetchData() {
        const URL = 'https://run.linwn.net/data/activities.json';
        try {
            const cache = await caches.open('run-data-cache');
            const cachedResponse = await cache.match(URL);
            if (cachedResponse) {
                const cachedData = await cachedResponse.json();
                processAndRenderRuns(cachedData);
            }
            const response = await fetch(URL);
            if (response.ok) {
                const responseToCache = response.clone(); 
                const freshData = await response.json();
                if (!cachedResponse || freshData.length !== allRuns.length) {
                    await cache.put(URL, responseToCache); 
                    processAndRenderRuns(freshData);
                }
            }
        } catch (error) { console.error('Data loading failed:', error); }
    }

    function calculatePace(speedMs) {
        if (!speedMs) return "-";
        const secPerKm = 1000 / speedMs;
        return `${Math.floor(secPerKm / 60)}'${Math.floor(secPerKm % 60).toString().padStart(2, '0')}"`;
    }

    function formatPaceFromSeconds(seconds) {
        if (!seconds || isNaN(seconds)) return "-";
        return `${Math.floor(seconds / 60)}'${Math.floor(seconds % 60).toString().padStart(2, '0')}"`;
    }

    function getNameByTime(dateStr) {
        if (!dateStr) return "跑步";
        const parts = dateStr.split(' ');
        if (parts.length < 2) return "跑步";
        const hour = parseInt(parts[1].split(':')[0], 10);
        if (hour >= 4 && hour < 10) return "晨跑";
        if (hour >= 10 && hour < 14) return "上午跑步";
        if (hour >= 14 && hour < 17) return "午后跑步";
        if (hour >= 17 && hour < 20) return "傍晚跑步";
        return "夜跑";
    }

    function formatDuration(timeStr) {
        if (!timeStr) return "0:00:00";
        return timeStr.split('.')[0];
    }

    // --- 图表管理核心逻辑 ---
    function destroyExistingCharts() {
        chartInstances.forEach(chart => chart.destroy());
        chartInstances = [];
        document.getElementById('weather-badge').style.display = 'none';
    }

    const commonChartOptions = {
        responsive: true,
        maintainAspectRatio: false, // 允许 Flexbox 自由压缩高度而不会溢出
        plugins: {
            legend: { display: false },
            tooltip: {
                backgroundColor: '#1a1a1a',
                titleColor: '#888888',
                bodyColor: '#ffffff',
                borderColor: '#2a2a2a',
                borderWidth: 1,
                displayColors: false
            }
        },
        scales: {
            x: { grid: { color: '#2a2a2a' }, ticks: { color: '#888888', font: { size: 10 } } },
            y: { grid: { color: '#2a2a2a' }, ticks: { color: '#888888', font: { size: 10 } } }
        }
    };

    function renderGlobalOrYearCharts() {
        destroyExistingCharts();
        const wrapper = document.getElementById('chart-container-wrapper');
        wrapper.innerHTML = '';

        if (currentYearFilter === 'all') {
            document.getElementById('chart-box-title').innerText = 'Annual Distance History';
            const yearlyData = {};
            allRuns.forEach(run => {
                if (run.start_date_local) {
                    const year = run.start_date_local.substring(0, 4);
                    yearlyData[year] = (yearlyData[year] || 0) + ((run.distance || 0) / 1000);
                }
            });

            const sortedYears = Object.keys(yearlyData).sort();
            const distances = sortedYears.map(yr => yearlyData[yr].toFixed(2));

            wrapper.innerHTML = `
                <div class="chart-sub-container">
                    <div class="chart-item"><canvas id="global-bar-chart"></canvas></div>
                </div>
            `;

            const ctx = document.getElementById('global-bar-chart').getContext('2d');
            chartInstances.push(new Chart(ctx, {
                type: 'bar',
                data: { labels: sortedYears, datasets: [{ data: distances, backgroundColor: '#e93342', borderRadius: 4 }] },
                options: {
                    ...commonChartOptions,
                    plugins: { ...commonChartOptions.plugins, tooltip: { ...commonChartOptions.plugins.tooltip, callbacks: { label: (c) => ` ${c.parsed.y} km` } } }
                }
            }));

        } else {
            document.getElementById('chart-box-title').innerText = `${currentYearFilter} Yearly Analytics`;

            const monthlyDistance = Array(12).fill(0);
            const monthlyPaceSum = Array(12).fill(0);
            const monthlyPaceCount = Array(12).fill(0);
            const monthlyHrSum = Array(12).fill(0);
            const monthlyHrCount = Array(12).fill(0);

            allRuns.forEach(run => {
                if (run.start_date_local && run.start_date_local.startsWith(currentYearFilter)) {
                    const monthIdx = parseInt(run.start_date_local.substring(5, 7), 10) - 1;
                    const distKm = (run.distance || 0) / 1000;
                    monthlyDistance[monthIdx] += distKm;
                    if (run.average_speed) {
                        monthlyPaceSum[monthIdx] += (1000 / run.average_speed);
                        monthlyPaceCount[monthIdx]++;
                    }
                    if (run.average_heartrate) {
                        monthlyHrSum[monthIdx] += run.average_heartrate;
                        monthlyHrCount[monthIdx]++;
                    }
                }
            });

            const finalDist = monthlyDistance.map(d => d > 0 ? d.toFixed(2) : null);
            const finalPace = monthlyPaceSum.map((sum, i) => monthlyPaceCount[i] > 0 ? Math.round(sum / monthlyPaceCount[i]) : null);
            const finalHr = monthlyHrSum.map((sum, i) => monthlyHrCount[i] > 0 ? Math.round(sum / monthlyHrCount[i]) : null);

            wrapper.innerHTML = `
                <div class="chart-sub-container">
                    <div class="chart-sub-title">Monthly Distance (km)</div>
                    <div class="chart-item"><canvas id="month-dist-chart"></canvas></div>
                </div>
                <div class="chart-sub-container">
                    <div class="chart-sub-title">Average Pace (min/km)</div>
                    <div class="chart-item"><canvas id="month-pace-chart"></canvas></div>
                </div>
                <div class="chart-sub-container">
                    <div class="chart-sub-title">Average Heart Rate (bpm)</div>
                    <div class="chart-item"><canvas id="month-hr-chart"></canvas></div>
                </div>
            `;

            const monthsLabels = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];

            chartInstances.push(new Chart(document.getElementById('month-dist-chart').getContext('2d'), {
                type: 'line',
                data: { labels: monthsLabels, datasets: [{ data: finalDist, borderColor: '#e93342', backgroundColor: 'rgba(233,51,66,0.05)', tension: 0.1, pointRadius: 3, spanGaps: false }] },
                options: commonChartOptions
            }));

            chartInstances.push(new Chart(document.getElementById('month-pace-chart').getContext('2d'), {
                type: 'line',
                data: { labels: monthsLabels, datasets: [{ data: finalPace, borderColor: '#ff9f43', tension: 0.1, pointRadius: 3, spanGaps: false }] },
                options: {
                    ...commonChartOptions,
                    scales: { x: commonChartOptions.scales.x, y: { ...commonChartOptions.scales.y, reverse: true, ticks: { ...commonChartOptions.scales.y.ticks, callback: (v) => formatPaceFromSeconds(v) } } },
                    plugins: { ...commonChartOptions.plugins, tooltip: { ...commonChartOptions.plugins.tooltip, callbacks: { label: (ctx) => ` Pace: ${formatPaceFromSeconds(ctx.parsed.y)}` } } }
                }
            }));

chartInstances.push(new Chart(document.getElementById('month-hr-chart').getContext('2d'), {
    type: 'line',
    data: { labels: monthsLabels, datasets: [{ data: finalHr, borderColor: '#4cd137', tension: 0.1, pointRadius: 3, spanGaps: false }] },
    options: {
        ...commonChartOptions,
        scales: {
            x: commonChartOptions.scales.x,
            y: { 
                ...commonChartOptions.scales.y, 
                min: 30, 
                max: 210 
            }
        }
    }
}));
        }
    }

    async function renderSingleRunCharts(runId, runName) {
        destroyExistingCharts();
        document.getElementById('chart-box-title').innerText = runName || 'Workout Details';
        const wrapper = document.getElementById('chart-container-wrapper');
        wrapper.innerHTML = '<div style="color:var(--text-muted);font-size:12px;padding:12px 0;">Loading details...</div>';

        try {
            const res = await fetch(`https://run.linwn.net/data/details/${runId}.json`);
            if (!res.ok) throw new Error('Detail not found');
            const detail = await res.json();
            wrapper.innerHTML = '';

            if (detail.weather) {
                const w = detail.weather;
                const weatherBadge = document.getElementById('weather-badge');
                weatherBadge.innerHTML = `☀️ ${w.temperature_c}°C  |  ${w.condition}  |  💨 ${w.wind_speed_kmh} km/h`;
                weatherBadge.style.display = 'block';
            }

            wrapper.innerHTML = `
                <div class="chart-sub-container">
                    <div class="chart-sub-title">Pace Curve</div>
                    <div class="chart-item"><canvas id="single-pace-chart"></canvas></div>
                </div>
                <div class="chart-sub-container">
                    <div class="chart-sub-title">Heart Rate Monitor</div>
                    <div class="chart-item"><canvas id="single-hr-chart"></canvas></div>
                </div>
            `;

            chartInstances.push(new Chart(document.getElementById('single-pace-chart').getContext('2d'), {
                type: 'line',
                data: { labels: detail.charts.pace.labels || [], datasets: [{ data: detail.charts.pace.data || [], borderColor: '#ff9f43', borderWidth: 1.5, pointRadius: 0, fill: false, tension: 0.1 }] },
                options: {
                    ...commonChartOptions,
                    scales: { x: commonChartOptions.scales.x, y: { ...commonChartOptions.scales.y, reverse: true, ticks: { ...commonChartOptions.scales.y.ticks, callback: (v) => formatPaceFromSeconds(v) } } },
                    plugins: { ...commonChartOptions.plugins, tooltip: { ...commonChartOptions.plugins.tooltip, callbacks: { label: (ctx) => ` Pace: ${formatPaceFromSeconds(ctx.parsed.y)}` } } }
                }
            }));

chartInstances.push(new Chart(document.getElementById('single-hr-chart').getContext('2d'), {
    type: 'line',
    data: { labels: detail.charts.hr.labels || [], datasets: [{ data: detail.charts.hr.data || [], borderColor: '#4cd137', borderWidth: 1.5, pointRadius: 0, fill: false, tension: 0.1 }] },
    options: {
        ...commonChartOptions,
        scales: {
            x: commonChartOptions.scales.x,
            y: { 
                ...commonChartOptions.scales.y, 
                min: 30, 
                max: 210 
            }
        }
    }
}));

        } catch (err) {
            console.error(err);
            wrapper.innerHTML = '<div style="color:var(--text-muted);font-size:12px;padding:12px 0;">Detailed charts unavailable for this activity.</div>';
        }
    }

    function renderTable() {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';

        const startIdx = (currentPage - 1) * itemsPerPage;
        const endIdx = startIdx + itemsPerPage;
        const pageData = filteredRuns.slice(startIdx, endIdx);

        pageData.forEach(run => {
            const distKm = (run.distance / 1000).toFixed(2);
            const pace = calculatePace(run.average_speed);
            const duration = formatDuration(run.moving_time);
            const name = run.name || getNameByTime(run.start_date_local);
            const hr = run.average_heartrate ? Math.round(run.average_heartrate) : '-';

            const tr = document.createElement('tr');
            tr.setAttribute('data-run-id', run.run_id || '');
            tr.innerHTML = `
                <td>${run.start_date_local || ''}</td>
                <td class="bold-white">${name}</td>
                <td><span class="bold-white">${distKm}</span> <span class="unit">km</span></td>
                <td>${duration}</td>
                <td>${pace}</td>
                <td>${hr}</td>
            `;
            tr.style.cursor = 'pointer';

            tr.addEventListener('click', () => {
                document.querySelectorAll('#table-body tr').forEach(r => r.classList.remove('active-row'));
                tr.classList.add('active-row');
                renderMap(run);
                if (run.run_id) renderSingleRunCharts(run.run_id, name);
            });
            tbody.appendChild(tr);
        });

        const totalPages = Math.ceil(filteredRuns.length / itemsPerPage) || 1;
        document.getElementById('page-info').innerText = `Page ${currentPage} of ${totalPages}`;
        
        const showEnd = Math.min(endIdx, filteredRuns.length);
        const showStart = filteredRuns.length === 0 ? 0 : startIdx + 1;
        document.getElementById('showing-text').innerText = `Showing ${showStart}-${showEnd} of ${filteredRuns.length}`;
    }

    function applyFilters() {
        if (currentYearFilter === 'all') {
            filteredRuns = [...allRuns];
        } else {
            filteredRuns = allRuns.filter(run => run.start_date_local && run.start_date_local.startsWith(currentYearFilter));
        }

        renderMap(filteredRuns);
        currentPage = 1;
        renderTable();
        renderGlobalOrYearCharts();
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentYearFilter = e.target.getAttribute('data-year');
            applyFilters();
        });
    });

    document.getElementById('prev-page').addEventListener('click', () => {
        if (currentPage > 1) { currentPage--; renderTable(); }
    });

    document.getElementById('next-page').addEventListener('click', () => {
        const totalPages = Math.ceil(filteredRuns.length / itemsPerPage);
        if (currentPage < totalPages) { currentPage++; renderTable(); }
    });
    
    fetchData();
</script>
</body>
</html>
