<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUNNING.2026 — 12 宫格跑步热力图</title>
<style>

    color:#e4e4e7;

  .wrap{ position:relative; }
  .wrap{ width:100%; max-width:640px; padding:56px 16px 72px; display:flex; flex-direction:column; align-items:center; }
  .title{
    margin:0; font-family: ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-weight:900; font-style:italic; text-transform:uppercase; letter-spacing:-0.05em;
    font-size:40px; color:rgba(255,255,255,.9); user-select:none;
  }
  .title span{ color:#E8AF33; }
  .sub{ margin:12px 0 0; font-size:13px; color:#a1a1aa; letter-spacing:.02em; }
  .sub b{ color:#e4e4e7; font-weight:500; font-variant-numeric:tabular-nums; }
  .sub i{ font-style:normal; color:#52525b; margin:0 8px; }
  .toolbar{ display:flex; gap:10px; margin:22px 0 26px; }
  .toolbar button{
    font-family:inherit; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:#71717a; background:transparent; border:1px solid #27272a; border-radius:999px;
    padding:6px 14px; cursor:pointer; transition:all .15s ease;
  }
  .toolbar button:hover{ color:#e4e4e7; border-color:#52525b; background:#18181b; }
  .toolbar button:disabled{ color:#52525b; border-color:#1f1f23; cursor:default; background:transparent; }
  .stage{ width:100%; display:flex; justify-content:center; overflow:hidden; }
  #scaler{ transform-origin:top center; }
  #board{ position:relative; }
  /* 城市光害:楼群后方的地平线暖光 */
  #board::before{
    content:""; position:absolute; left:-8%; right:-8%; top:52%; bottom:-6%;
    background:radial-gradient(ellipse 58% 52% at 50% 74%, rgba(232,175,51,.10), transparent 72%);
    pointer-events:none; z-index:-1;
  }
  /* ---- 楼体:夜色中的高楼轮廓 ---- */
  .tower{
    position:absolute; border-radius:5px 5px 1px 1px;
    background:linear-gradient(180deg,#080a0f 0%,#0b0e14 38%,#0d1118 76%,#131822 100%);
    border:1px solid #161d28;
    box-shadow:0 8px 22px rgba(0,0,0,.6), inset 0 1px 0 rgba(180,205,255,.05);
    animation:towerIn .34s cubic-bezier(.2,.8,.3,1) both;
  }
  .tower::after{                       /* 楼底街灯的暖光反射 */
    content:""; position:absolute; left:10%; right:10%; bottom:0; height:7px;
    background:linear-gradient(180deg, rgba(232,175,51,.14), rgba(232,175,51,0));
    pointer-events:none; border-radius:0 0 1px 1px;
  }
  @keyframes towerIn{ from{ opacity:0; transform:translateY(7px); } to{ opacity:1; transform:none; } }
  /* ---- 窗户 ---- */
  .cell{ position:absolute; border-radius:1px; box-shadow: var(--glow, 0 0 0 0 transparent); }
  /* 三种"通电"曲线:直接亮 / 闪一下再亮 / 慢启动闪两下 */
  .cell.w0{ animation:win0 .42s linear both; }
  .cell.w1{ animation:win1 .42s linear both; }
  .cell.w2{ animation:win2 .42s linear both; }
  @keyframes win0{ 0%{opacity:0}   34%{opacity:1}   100%{opacity:1} }
  @keyframes win1{ 0%{opacity:0}   17%{opacity:.92} 27%{opacity:.14} 45%{opacity:1}  100%{opacity:1} }
  @keyframes win2{ 0%{opacity:0}   11%{opacity:.36} 21%{opacity:.07} 33%{opacity:.78} 43%{opacity:.18} 60%{opacity:1} 100%{opacity:1} }
  /* 每盏亮着的窗都有辉光:跑得越多,光越亮、晕开越大 */
  .cell:hover{ box-shadow: var(--glow, 0 0 0 0 transparent), 0 0 0 2px rgba(255,255,255,.65); z-index:5; }
  @media (prefers-reduced-motion: reduce){ .cell,.tower,.mname,.mkm{ animation:none; opacity:1; transform:none; } }
  .lab{
    position:absolute; font-size:7px; line-height:8px; color:#52525b;
    font-family:ui-monospace, Menlo, monospace; user-select:none; pointer-events:none; white-space:nowrap;
  }
  .mhead{
    position:absolute; display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid #182029; padding-bottom:3px;
  }

  .mname, .mkm{
    color:#CFD6E0; letter-spacing:.14em; font-variant-numeric:tabular-nums;
    animation:headIn .3s ease-out both;
  }
  .mname{ font-size:11px; font-weight:700; }
  .mkm{ font-size:14px; font-weight:800; letter-spacing:.01em; text-shadow:0 0 9px rgba(207,214,224,.22); }
  .mkm.dim{ font-weight:600; font-size:13px; color:#4B5565; text-shadow:none; }
  @keyframes headIn{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:none; } }
  .legend{ display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:14px; margin-top:34px; font-size:11px; color:#CFD6E0; }
  .legend .item{ display:flex; align-items:center; gap:7px; }
  .legend .dot{ width:10px; height:10px; border-radius:999px; }
  .legend .lessmore{ font-size:10px; color:#7d8899; letter-spacing:.06em; }
  #tip{
    position:fixed; z-index:50; pointer-events:none; display:none;
    background:#18181b; border:1px solid #3f3f46; border-radius:6px;
    padding:5px 9px; font-size:11px; color:#e4e4e7; white-space:nowrap;
    transform:translate(-50%,-135%);
  }
  #tip .km{ color:#E8AF33; }
  .loading{ font-size:11px; color:#52525b; letter-spacing:.1em; text-transform:uppercase; }
</style>
</head>

        html += '<div class="cell" data-tip="'+c.tip+'" style="left:'+c.x+'px;top:'+c.y+'px;width:'+CELL+
                'px;height:'+CELL+'px;background:'+c.color+'"></div>';
      }
    }
    board.style.width  = model.W+"px";
    board.style.height = model.H+"px";
    board.innerHTML = html;
    fitScale();
    animateStats(model);
  }
  function fitScale(){
    var stage = document.getElementById("stage"), scaler = document.getElementById("scaler");
    var board = document.getElementById("board");
    var natW = parseFloat(board.style.width);
    if(!isFinite(natW) || natW <= 0) return;         // 还没渲染过(fetch 未返回)就别缩放
    var s = Math.min(1, stage.clientWidth/natW);
    scaler.style.transform = "scale("+s+")";
    scaler.style.height = (parseFloat(board.style.height)*s)+"px";
    scaler.style.width  = (natW*s)+"px";
  }

  function fmtKm(m){
    return (m/1000).toLocaleString("en-US",{minimumFractionDigits:1, maximumFractionDigits:1});
  }
  // 按"点亮时刻"排序的累计里程/天数 —— 数字随格子逐一点亮而增长
  function buildReveal(model){
    var arr = [], i, mx = 0;
    for(i=0;i<model.cells.length;i++){
      var c = model.cells[i];
      if(c.dist>0) arr.push(c);
      if(c.delay>mx) mx = c.delay;
    }
    arr.sort(function(a,b){ return a.delay - b.delay; });
    var km=[0], cnt=[0], dl=[];                    // km[i] = 前 i 个已点亮格子的累计里程
    for(i=0;i<arr.length;i++){
      km.push(km[i]+arr[i].dist); cnt.push(cnt[i]+1); dl.push(arr[i].delay);
    }
    model.maxDelay = mx;
    model.reveal = { km:km, cnt:cnt, dl:dl };
  }
  function statsAt(rev, t){                          // 已完全点亮的格子累计值
    var lo = 0, hi = rev.dl.length;
    while(lo < hi){
      var mid = (lo+hi)>>1;
      if(rev.dl[mid] + ON_LAG <= t) lo = mid+1; else hi = mid;
    }
    return { km: rev.km[lo], active: rev.cnt[lo] };
  }
  function statsHTML(s){
    return "<b>"+fmtKm(s.km)+" km</b><i>·</i><b>"+s.active+"</b> run days";
  }
  var statRAF = null, statEnd = null;
  function animateStats(model){
    buildReveal(model);
    var el = document.getElementById("stats"), rev = model.reveal;
    if(statRAF){ cancelAnimationFrame(statRAF); statRAF = null; }
    var total = statsAt(rev, Infinity);
    var dur  = model.maxDelay + FLICK + 0.25;
    var clock = function(){ return Date.now(); };
    var t0 = clock();
    function frame(){
      var t = (clock() - t0)/1000;
      el.innerHTML = statsHTML(t >= dur ? total : statsAt(rev, t));
      if(t < dur) statRAF = requestAnimationFrame(frame);
      else { statRAF = null; el.innerHTML = statsHTML(total); }
    }
    el.innerHTML = statsHTML(statsAt(rev, 0));
    statRAF = requestAnimationFrame(frame);
    clearTimeout(statEnd);                           // 兜底:即使 rAF 被节流也能落到终值
    statEnd = setTimeout(function(){
      if(statRAF){ cancelAnimationFrame(statRAF); statRAF = null; }
      el.innerHTML = statsHTML(total);
    }, dur*1000 + 400);
  }
  function renderLegend(){
    var items = [
      ["rest",  C.empty,    null],
      ["< 5km", C.levels[0], C.glow[0]],
      ["5-10km",C.levels[1], C.glow[1]],
      ["10-20km",C.levels[2],C.glow[2]],
      ["> 20km",C.levels[3], C.glow[3]]
    ];
    var html = '<span class="lessmore">DIM</span>';
    items.forEach(function(it){
      html += '<span class="item"><span class="dot" style="background:'+it[1]+
              (it[2] ? ';box-shadow:'+it[2] : '')+'"></span>'+it[0]+'</span>';
    });
    html += '<span class="lessmore">BRIGHT</span>';
    document.getElementById("legend").innerHTML = html;
  }

  // ---- tooltip ----
  var tip = document.getElementById("tip");
  document.getElementById("board").addEventListener("mousemove", function(e){
    var t = e.target;
    if(t && t.classList && t.classList.contains("cell")){
      var raw = t.getAttribute("data-tip").split("|");
      var tail = raw[1]==="out" ? "out of range"
               : raw[1]==="future" ? "future"
               : (+raw[1]>0) ? '<span class="km">'+(raw[1]/1000).toFixed(1)+" km</span>" : "rest";
      tip.innerHTML = raw[0]+" · "+tail;
      tip.style.display = "block";
      tip.style.left = e.clientX+"px";
      tip.style.top  = e.clientY+"px";
    }else{ tip.style.display = "none"; }
  });
  document.getElementById("board").addEventListener("mouseleave", function(){ tip.style.display="none"; });

  function frameLayout(model){
    var PAD = 24;
    var W = Math.max(model.W + PAD*2, 300);
    return {
      PAD:PAD, W:W,
      titleY: PAD + 26,
      statsY: PAD + 50,
      boardX: Math.round((W - model.W)/2),
      boardY: PAD + 84,
      H: PAD + 84 + model.H + 46
    };
  }

  function roundRect(ctx, x, y, w, h, r){
    var tl = r[0], tr = r[1], br = r[2], bl = r[3];
    ctx.beginPath();
    ctx.moveTo(x+tl, y);
    ctx.lineTo(x+w-tr, y);       ctx.arcTo(x+w, y,   x+w, y+tr, tr);
    ctx.lineTo(x+w, y+h-br);     ctx.arcTo(x+w, y+h, x+w-br, y+h, br);
    ctx.lineTo(x+bl, y+h);       ctx.arcTo(x, y+h,   x, y+h-bl, bl);
    ctx.lineTo(x, y+tl);         ctx.arcTo(x, y,     x+tl, y, tl);
    ctx.closePath();
  }

  // s: 输出倍率(CSS 版式坐标 * s = 实际像素)。矢量绘制,放大后依然清晰
  function drawFrame(ctx, model, L, t, s){
    s = s || 1;
    ctx.setTransform(s,0,0,s,0,0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#06070b";
    ctx.fillRect(0,0,L.W,L.H);
    // 城市光害:楼群后方的地平线辉光
    var haze = ctx.createRadialGradient(L.W/2, L.boardY + model.H*0.80, 10,
                                        L.W/2, L.boardY + model.H*0.80, model.W*0.92);
    haze.addColorStop(0, "rgba(232,175,51,.085)");
    haze.addColorStop(0.55, "rgba(232,175,51,.030)");
    haze.addColorStop(1, "rgba(232,175,51,0)");
    ctx.fillStyle = haze;
    ctx.fillRect(0,0,L.W,L.H);

    // title
    ctx.textBaseline = "alphabetic";
    ctx.font = 'italic 900 30px system-ui, "Segoe UI", sans-serif';
    ctx.textAlign = "left";
    ctx.fillStyle = "#f4f4f5"; ctx.fillText("RUNNING", L.PAD, L.titleY);
    var w1 = ctx.measureText("RUNNING").width;
    ctx.fillStyle = C.accent; ctx.fillText(".2026", L.PAD + w1, L.titleY);

    // stats
    ctx.font = '13px ui-monospace, Menlo, monospace';
    ctx.fillStyle = "#a1a1aa";
    var st = model.reveal ? statsAt(model.reveal, t) : {km:0, active:0};
    ctx.fillText(fmtKm(st.km)+" km  ·  "+st.active+" run days", L.PAD, L.statsY);

    // board
    ctx.save();
    ctx.translate(L.boardX, L.boardY);
    var i, c;
    if(model.kind==="blocks"){
      // 楼体:一栋栋浮现
      for(i=0;i<model.towers.length;i++){
        var tw = model.towers[i];
        var ta = (t - tw.delay)/TOWER_FADE;
        if(ta<=0) continue;
        if(ta>1) ta = 1;
        ctx.globalAlpha = ta;
        var g = ctx.createLinearGradient(0, tw.y, 0, tw.y+tw.h);
        g.addColorStop(0,    "#080a0f");
        g.addColorStop(0.38, "#0b0e14");
        g.addColorStop(0.76, "#0d1118");
        g.addColorStop(1,    "#131822");
        ctx.fillStyle = g;
        roundRect(ctx, tw.x, tw.y, tw.w, tw.h, [5,5,1,1]);
        ctx.fill();
        ctx.strokeStyle = "#161d28"; ctx.lineWidth = 1;
        roundRect(ctx, tw.x+0.5, tw.y+0.5, tw.w-1, tw.h-1, [5,5,1,1]);
        ctx.stroke();
        var bg2 = ctx.createLinearGradient(0, tw.y+tw.h-8, 0, tw.y+tw.h);
        bg2.addColorStop(0, "rgba(232,175,51,0)");
        bg2.addColorStop(1, "rgba(232,175,51,.14)");
        ctx.fillStyle = bg2;
        ctx.fillRect(tw.x+tw.w*0.10, tw.y+tw.h-8, tw.w*0.80, 8);
      }
      ctx.globalAlpha = 1;
      for(i=0;i<model.heads.length;i++){
        var hd = model.heads[i];
        var aName = (t - hd.delay)/TOWER_FADE;
        var aKm   = (t - hd.kmDelay)/0.30;
        if(aName<=0 && aKm<=0) continue;
        ctx.strokeStyle = "#182029"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(hd.x, hd.y+18.5); ctx.lineTo(hd.x+hd.w, hd.y+18.5); ctx.stroke();
        if(aName > 0){                               // 月名:随楼体浮现
          ctx.globalAlpha = Math.min(1, aName);
          ctx.font = '700 11px ui-monospace, Menlo, monospace';
          ctx.fillStyle = C.head; ctx.textAlign = "left";
          ctx.fillText(hd.name, hd.x, hd.y+11);
        }
        if(aKm > 0){                                 // 跑量:等这栋楼开始点灯才出现
          ctx.globalAlpha = Math.min(1, aKm);
          ctx.font = (hd.has?'800 14px':'600 13px')+' ui-monospace, Menlo, monospace';
          if(hd.has){ ctx.shadowColor = "rgba(207,214,224,.30)"; ctx.shadowBlur = 7*s; }
          ctx.fillStyle = hd.has ? C.head : C.headDim; ctx.textAlign = "right";
          ctx.fillText(hd.km, hd.x+hd.w, hd.y+12);
          ctx.shadowBlur = 0;
        }
      }
    }else{
      ctx.font = '7px ui-monospace, Menlo, monospace';
      ctx.fillStyle = "#6b7686";
      for(i=0;i<model.labels.length;i++){
        var lb = model.labels[i];
        ctx.textAlign = lb.align==="right" ? "right" : (lb.align==="center" ? "center" : "left");
        var lx = lb.align==="right" ? lb.x+lb.w : (lb.align==="center" ? lb.x+lb.w/2 : lb.x);
        ctx.fillText(lb.text, lx, lb.y+8);
      }
    }
    for(i=0;i<model.cells.length;i++){
      c = model.cells[i];
      // 楼体还在淡入时,窗户跟着一起出现
      var ta = 1;
      if(model.kind==="blocks"){
        ta = (t - model.towers[c.t].delay)/TOWER_FADE;
        if(ta<=0) continue;
        if(ta>1) ta = 1;
      }
      if(c.lvl<0){                                  // 黑着的窗:本来就长在楼上
        ctx.globalAlpha = ta * (model.kind==="blocks" ? 1 : Math.min(1, Math.max(0, t/0.3)));
        ctx.fillStyle = c.color;
        ctx.fillRect(c.x, c.y, CELL, CELL);
        continue;
      }
      var p = (t - c.delay)/FLICK;
      if(p<=0) continue;
      var al = ta * kfAt(FLICK_KF[c._fk], p);       // 通电:闪烁着升到满亮度
      if(al<=0.004) continue;
      ctx.globalAlpha = al > 1 ? 1 : al;
      ctx.fillStyle = c.color;
      if(C.glowBlur[c.lvl] > 0){
        ctx.shadowColor = C.glowRGB[c.lvl];
        ctx.shadowBlur  = C.glowBlur[c.lvl] * s;    // 每盏灯都往外晕光
      }
      ctx.fillRect(c.x, c.y, CELL, CELL);
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.restore();

    // legend
    if(L.W >= 330){
      var items = [["rest",C.empty],["< 5km",C.levels[0]],["5-10km",C.levels[1]],["10-20km",C.levels[2]],["> 20km",C.levels[3]]];
      var la = Math.max(0, (t-0.2)/0.4); if(la>1) la = 1;
      ctx.globalAlpha = Math.max(0, la);
      ctx.font = '10px ui-monospace, Menlo, monospace';
      var total = 0, widths = [];
      for(i=0;i<items.length;i++){
        var wd = ctx.measureText(items[i][0]).width + 17;
        widths.push(wd); total += wd + 12;
      }
      total -= 12;
      var lx2 = Math.round((L.W - total)/2), ly = L.boardY + model.H + 28;
      for(i=0;i<items.length;i++){
        ctx.fillStyle = items[i][1];
        if(i>0){ ctx.shadowColor = C.glowRGB[i-1]; ctx.shadowBlur = C.glowBlur[i-1]*s; }
        ctx.fillRect(lx2, ly-8, 10, 10);
        ctx.shadowBlur = 0;
        ctx.fillStyle = C.head; ctx.textAlign = "left";
        ctx.fillText(items[i][0], lx2+15, ly);
        lx2 += widths[i] + 12;
      }
      ctx.globalAlpha = 1;
    }
  }

  // ---- MP4 导出 (WebCodecs H.264 + MP4 封装,适合微信朋友圈) ----
  var VIDEO_TARGET_W = 1080;                       // 输出宽度;高度为偶数(H.264 yuv420p 要求)
  function evenDim(v){ var n = Math.round(v); return n % 2 ? n+1 : n; }
  function maxCellDelay(model){
    var md = 0;
    for(var i=0;i<model.cells.length;i++) if(model.cells[i].delay>md) md = model.cells[i].delay;
    return md;
  }
  function pickCodec(W, H, fps){
    if(typeof VideoEncoder === "undefined" || !Mp4Muxer) return null;
    // 由高到低:High 4.0 -> Main 4.0 -> Baseline 3.1,至少要覆盖当前分辨率
    var cands = ["avc1.640028", "avc1.4d4028", "avc1.4d401f", "avc1.42e01e", "avc1.42001f"];
    return (function next(k){
      if(k >= cands.length) return Promise.resolve(null);
      var cfg = { codec:cands[k], width:W, height:H, bitrate:bitrateFor(W,H,fps),
                  framerate:fps, latencyMode:"quality", avc:{ format:"avc" } };
      return VideoEncoder.isConfigSupported(cfg).then(function(r){
        if(r && r.supported) return cands[k];
        return next(k+1);
      }).catch(function(){ return next(k+1); });
    })(0);
  }
  function bitrateFor(W, H, fps){
    return Math.min(12000000, Math.max(2500000, Math.round(W*H*fps*0.09)));
  }
  function save(blob, name){
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name; a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 8000);
  }

  var vidBusy = false;
  function exportVideo(){
    if(vidBusy || !currentModel) return;
    var btn = document.getElementById("videoBtn");
    var model = currentModel, L = frameLayout(model);

    var s  = VIDEO_TARGET_W / L.W;
    var W  = evenDim(L.W * s), H = evenDim(L.H * s);
    var maxDelay = maxCellDelay(model);
    var fps = 30, n = Math.max(2, Math.round((maxDelay + FLICK + 0.85) * fps));
    var stepUs = Math.round(1e6/fps);

    // ---- 一趟完整的编码 ----
    // 硬件编码器(Media Foundation 等)在喂帧速度远超编码速度时会静默丢帧:第一个
    // output chunk 不是第 0 帧。那既会触发 mp4-muxer 的首帧时间戳校验(默认 strict),
    // 又会写出一个首样本不是关键帧、播放器根本解不出来的 mp4。所以:
    //   attempt 0 —— 一进一出尽快喂(编码器始终只有 1 帧在飞,不给它积压的机会)
    //   attempt 1 —— 再按 ~30fps 真实时间喂(最保守,硬件编码器按实时来就不会丢)
    function encodePass(codec, attempt){
      return new Promise(function(resolve, reject){
        var canvas = document.createElement("canvas");
        canvas.width = W; canvas.height = H;
        var ctx = canvas.getContext("2d", { alpha:false });
        var muxer = new Mp4Muxer.Muxer({
          target: new Mp4Muxer.ArrayBufferTarget(),
          video: { codec:"avc", width:W, height:H, frameRate:fps },
          fastStart: "in-memory",
          // 首帧时间戳非 0 时交给封装层整体平移,而不是直接抛错(丢帧另有检测)
          firstTimestampBehavior: "offset"
        });
        var encErr = null, outCount = 0, waiter = null, encStalled = false, headSeen = false;
        var encoder = new VideoEncoder({
          output: function(chunk, meta){
            outCount++;
            if(!headSeen){
              headSeen = true;
              // 首帧必须存在、是关键帧;第一趟还要求时间戳为 0,否则说明开头被吞了
              if(chunk.type !== "key" || (attempt === 0 && chunk.timestamp !== 0)){
                encErr = new Error("encoder dropped leading frames (first output ts=" +
                                   chunk.timestamp + "us, type=" + chunk.type + ")");
                encErr.headLost = true;
              }
            }
            if(waiter){ var w = waiter; waiter = null; w(); }
            muxer.addVideoChunk(chunk, meta);
          },
          error:  function(e){ encErr = e; if(waiter){ var w2 = waiter; waiter = null; w2(); } }
        });
        encoder.configure({ codec:codec, width:W, height:H, framerate:fps,
                            bitrate:bitrateFor(W,H,fps), latencyMode:"quality",
                            avc:{ format:"avc" } });
        var i = 0;
        // 一进一出:喂一帧就一直等到编码器把它吐出来。编码器若长时间不吐帧(某些实现
        // 会攒一批再出),2.5s 后自动降级为快速喂帧,避免整个导出卡死。
        function waitOut(){
          if(encErr || encStalled || outCount >= i) return Promise.resolve();
          return new Promise(function(res){
            var fired = false;
            waiter = function(){ if(fired) return; fired = true; res(); };
            setTimeout(function(){
              if(fired) return; fired = true; waiter = null; encStalled = true; res();
            }, 2500);
          });
        }
        // attempt 1 的节流:按 34ms/帧(≈30fps 的真实时间节奏)喂帧。用定时器而不是
        // rAF —— rAF 依赖合成器,无头/被遮挡/后台窗口里可能很慢甚至不触发。
        function pace(){
          if(attempt === 0 || encStalled) return Promise.resolve();
          return new Promise(function(res){ setTimeout(res, 34); });
        }
        function pump(){
          if(encErr) return Promise.reject(encErr);
          if(i >= n) return Promise.resolve();
          drawFrame(ctx, model, L, i/fps, s);
          var frame = new VideoFrame(canvas, { timestamp:i*stepUs, duration:stepUs });
          encoder.encode(frame, { keyFrame: i % (fps*2) === 0 });
          frame.close();
          i++;
          if(i % 5 === 0 || i === n){
            btn.textContent = "生成中 " + i + "/" + n + (attempt ? " ·慢速重试" : "");
          }
          return waitOut().then(pace).then(pump);
        }
        pump()
          .then(function(){ return encoder.flush(); })
          .then(function(){
            if(encErr) throw encErr;
            encoder.close();
            if(outCount < n){ console.warn("[export] 编码器丢帧:", outCount + "/" + n); }
            muxer.finalize();
            resolve(muxer.target.buffer);
          })
          .catch(function(e){
            try{ encoder.close(); }catch(e2){}
            reject(e);
          });
      });
    }

    vidBusy = true; btn.disabled = true; btn.textContent = "准备中…";

    pickCodec(W, H, fps).then(function(codec){
      if(!codec){                                  // 浏览器不支持 WebCodecs 就无法本地编码
        vidBusy = false; btn.disabled = false;
        btn.textContent = "此浏览器不支持导出";
        setTimeout(function(){ if(!vidBusy) btn.textContent = "⬇ 导出 MP4"; }, 3000);
        return;
      }
      return encodePass(codec, 0)
        .catch(function(e){
          if(e && e.headLost){                     // 开头被编码器吞了:换真实时间节奏重试一次
            console.warn("[export] 第一趟编码丢帧,改为真实时间节奏重试:", e.message);
            btn.textContent = "重试中…";
            return encodePass(codec, 1);
          }
          throw e;
        })
        .then(function(buffer){
          var kb = Math.round(buffer.byteLength/1024);
          save(new Blob([buffer], { type:"video/mp4" }),
               "running-2026-"+mode+"-"+W+"x"+H+".mp4");
          btn.textContent = "✓ 已导出 " + (kb/1024).toFixed(1) + " MB";
        });
    }).catch(function(e){
      console.error("[export]", e);
      btn.textContent = (e && e.headLost) ? "导出失败:编码器丢帧" : "导出失败,请重试";
    }).then(function(){
      vidBusy = false; btn.disabled = false;
      setTimeout(function(){ if(!vidBusy) btn.textContent = "⬇ 导出 MP4"; }, 2600);
    });
  }

  // ---- controls ----
  var NEXT = { blocks:["v","↓ 纵向一览"], v:["h","→ 横向一览"], h:["blocks","⊞ 宫格视图"] };
  var viewBtn = document.getElementById("viewBtn");
  function syncBtn(){ viewBtn.textContent = NEXT[mode][1]; }
  viewBtn.addEventListener("click", function(){
    if(!currentModel) return;                        // 数据还没到,切换/重播都没有意义
    mode = NEXT[mode][0]; syncBtn(); render();
  });
  document.getElementById("replayBtn").addEventListener("click", function(){
    if(currentModel) render();
  });
  document.getElementById("videoBtn").addEventListener("click", exportVideo);
  window.addEventListener("resize", fitScale);

  // ---- data loading (live fetch only; 无内嵌快照) ----
  function setDailyFromList(arr){
    var m = {}, i;
    for(i=0;i<arr.length;i++){
      var ds = String(arr[i].start_date_local||"").slice(0,10);
      if(ds.slice(0,4)===String(YEAR)) m[ds] = (m[ds]||0)+(arr[i].distance||0);
    }
    daily = m;
  }
  function statsMsg(text){
    document.getElementById("stats").innerHTML = '<span class="loading">'+text+'</span>';
  }
  function boot(){
    renderLegend(); syncBtn();                       // 数据到手前只画静态部分,#stats 保持 LOADING
    fetch(DATA_URL+"?t="+Date.now())
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(arr){
        setDailyFromList(arr);
        render();
      })
      .catch(function(){
        statsMsg("DATA UNAVAILABLE · "+DATA_URL);    // 取不到就明说,不拿假数据凑数
      });
  }
  boot();
})();
</script>
</body>
</html>
