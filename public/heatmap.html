<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUNNING HEATMAP</title>
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:#09090b; min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
    color:#e4e4e7;
  }
  .wrap{ width:100%; max-width:640px; padding:56px 16px 72px; display:flex; flex-direction:column; align-items:center; }
  .title{
    margin:0; font-family: ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-weight:900; font-style:italic; text-transform:uppercase; letter-spacing:-0.05em;
    font-size:40px; color:rgba(255,255,255,.9); user-select:none;
  }
  .title span{ color:#dc2626; }
  .sub{ margin:12px 0 0; font-size:13px; color:#a1a1aa; letter-spacing:.02em; }
  .sub b{ color:#e4e4e7; font-weight:500; }
  .sub i{ font-style:normal; color:#52525b; margin:0 8px; }
  .toolbar{ display:flex; gap:10px; margin:22px 0 26px; }
  .toolbar button{
    font-family:inherit; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:#71717a; background:transparent; border:1px solid #27272a; border-radius:999px;
    padding:6px 14px; cursor:pointer; transition:all .15s ease;
  }
  .toolbar button:hover{ color:#e4e4e7; border-color:#52525b; background:#18181b; }
  .toolbar button:disabled{ color:#52525b; border-color:#1f1f23; cursor:default; background:transparent; }
  .stage{ width:100%; display:flex; justify-content:center; overflow:hidden; }
  #scaler{ transform-origin:top center; }
  #board{ position:relative; }
  .cell{
    position:absolute; border-radius:2px;
    box-shadow: var(--glow, 0 0 0 0 transparent);
    animation:pop .3s ease-out both; will-change:transform,opacity;
  }
  /* 高强度格子自带辉光:跑得越多,光越亮 */
  .cell:hover{ box-shadow: var(--glow, 0 0 0 0 transparent), 0 0 0 2px rgba(255,255,255,.65); z-index:5; }
  @keyframes pop{ from{ opacity:0; transform:scale(0); } to{ opacity:1; transform:scale(1); } }
  @media (prefers-reduced-motion: reduce){ .cell{ animation:none; } }
  .lab{
    position:absolute; font-size:7px; line-height:8px; color:#52525b;
    font-family:ui-monospace, Menlo, monospace; user-select:none; pointer-events:none; white-space:nowrap;
  }
  .mhead{
    position:absolute; display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid #1f1f23; padding-bottom:3px;
  }
  .mname{ font-size:11px; font-weight:700; letter-spacing:.14em; color:#d4d4d8; }
  .mkm{ font-size:9px; color:#52525b; }
  .legend{ display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:14px; margin-top:34px; font-size:11px; color:#d4d4d8; }
  .legend .item{ display:flex; align-items:center; gap:7px; }
  .legend .dot{ width:10px; height:10px; border-radius:999px; }
  .legend .lessmore{ font-size:10px; color:#71717a; letter-spacing:.06em; }
  #tip{
    position:fixed; z-index:50; pointer-events:none; display:none;
    background:#18181b; border:1px solid #3f3f46; border-radius:6px;
    padding:5px 9px; font-size:11px; color:#e4e4e7; white-space:nowrap;
    transform:translate(-50%,-135%);
  }
  #tip .km{ color:#f87171; }
  .loading{ font-size:11px; color:#52525b; letter-spacing:.1em; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="wrap">
    <h1 class="title">RUNNING<span>.2026</span></h1>
    <p class="sub" id="stats"><span class="loading">LOADING DATA…</span></p>

    <div class="toolbar">
      <button id="replayBtn" title="重播填充动画">↻ 重播动画</button>
      <button id="gifBtn" title="导出填充动画 GIF">⬇ 导出 GIF</button>
      <button id="viewBtn" title="切换视图">↓ 纵向一览</button>
    </div>

    <div class="stage" id="stage">
      <div id="scaler"><div id="board"></div></div>
    </div>

    <div class="legend" id="legend"></div>
  </div>
  <div id="tip"></div>

  <script type="application/json" id="fallback-data">{"2026-01-01": 20259.7}</script>

<script>
(function(){
  "use strict";

  var YEAR = 2026;
  var DATA_URL = "https://run.linwn.net/data/all.json";

  // ---- visual constants ----
  var CELL = 8, GAP = 6, GUT = 26, LBL = 14;
  var C = {
    off    : "#131316",                           // padding cells & future dates
    empty  : "#27272a",                           // 未跑:熄灭的中性灰(无彩度,不与"微光"混淆)
    // 黑体辐射式色阶:越跑越亮 —— 暗火 -> 火焰红 -> 炽橙 -> 亮黄
    levels : ["#7A2B2E", "#D6402B", "#FF8C1A", "#FFE066"],
    // 相对亮度 L: 0.020 -> 0.061 -> 0.181 -> 0.401 -> 0.755 (逐级约翻倍)
    glow   : [null, null, "0 0 4px rgba(255,140,26,.40)", "0 0 7px rgba(255,224,102,.55)"],
    thr    : [5000, 10000, 20000]                 // meters
  };
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var DAYS   = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  var ROW_DELAY   = 0.05;                         // seconds between week rows inside a block
  var MONTH_DELAY = 0.30;                         // seconds between consecutive month blocks
  var POP = 0.30;                                 // per-cell pop duration (matches CSS)

  var BW = 7*(CELL+GAP)-GAP;                      // month block width = 92
  var HEAD = 18, BLOCK_GX = 34, BLOCK_GY = 26;

  var mode = "blocks";                            // blocks | v | h
  try{
    var q = new URLSearchParams(location.search).get("mode");
    if(q==="v"||q==="h"||q==="blocks") mode = q;
  }catch(e){}

  var daily = {};                                 // "YYYY-MM-DD" -> meters
  var currentModel = null;                        // keeps geometry for the GIF renderer

  // ---- helpers ----
  function pad(n){ return String(n).padStart(2,"0"); }
  function dkey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function todayKey(){ var t = new Date(); t.setHours(0,0,0,0); return dkey(t); }
  function yearStart(){
    var j = new Date(YEAR,0,1), dow = (j.getDay()+6)%7;
    var s = new Date(j); s.setDate(j.getDate()-dow); return s;
  }
  function monthMeta(mi){
    var first = new Date(YEAR, mi, 1);
    var dow = (first.getDay()+6)%7;               // Monday = 0
    var dim = new Date(YEAR, mi+1, 0).getDate();
    return { dow:dow, dim:dim, rows: Math.ceil((dow+dim)/7) };
  }
  function levelOf(dist, future, off){
    if(off || future || dist<=0) return -1;       // 未点亮
    var t = C.thr;
    return dist<t[0]?0 : dist<t[1]?1 : dist<t[2]?2 : 3;
  }
  function colorFor(lvl, future, off){
    if(off || future) return C.off;
    if(lvl<0) return C.empty;
    return C.levels[lvl];
  }
  function cellDelay(row, col, month){
    if(mode==="blocks") return month*MONTH_DELAY + row*ROW_DELAY;
    if(mode==="v")      return row*ROW_DELAY;
    return col*ROW_DELAY;
  }
  function tipOf(k, dist, future, off){
    return off ? k+"|out" : future ? k+"|future" : k+"|"+dist;
  }

  // ---- model builders ----
  function buildBlocks(){
    var tk = todayKey(), metas = [], maxRows = 0, m, i;
    for(m=0; m<12; m++){ var g = monthMeta(m); metas.push(g); if(g.rows>maxRows) maxRows = g.rows; }
    var BH = maxRows*(CELL+GAP)-GAP;

    var model = {
      kind:"blocks", heads:[], cells:[], labels:[],
      W: 3*BW + 2*BLOCK_GX,
      H: 4*(HEAD+BH) + 3*BLOCK_GY
    };
    for(m=0; m<12; m++){
      var meta = metas[m];
      var bx = (m%3)*(BW+BLOCK_GX);
      var by = Math.floor(m/3)*(HEAD+BH+BLOCK_GY);

      var sum = 0;
      for(i=1; i<=meta.dim; i++){
        var kk = YEAR+"-"+pad(m+1)+"-"+pad(i);
        if(daily[kk]) sum += daily[kk];
      }
      model.heads.push({ x:bx, y:by, w:BW, name:MONTHS[m].toUpperCase(),
                         km:(sum>0?(sum/1000).toFixed(0)+" km":"—"), delay:m*MONTH_DELAY });

      for(i=0; i<maxRows*7; i++){
        var r = Math.floor(i/7), c = i%7;
        var dayNum = i - meta.dow + 1;
        var off = (dayNum<1 || dayNum>meta.dim);
        var dt  = new Date(YEAR, m, dayNum);
        var k   = dkey(dt);
        off = off || dt.getMonth()!==m;
        var dist = daily[k]||0, future = !off && k>tk;
        var lvl = levelOf(dist, future, off);
        model.cells.push({
          x: bx + c*(CELL+GAP), y: by + HEAD + r*(CELL+GAP),
          lvl: lvl, color: colorFor(lvl,future,off), delay: cellDelay(r,c,m),
          tip: tipOf(k,dist,future,off)
        });
      }
    }
    return model;
  }

  function buildLinear(){
    var v = (mode==="v"), start = yearStart(), tk = todayKey();
    var COLS = v?7:53, ROWS = v?53:7;
    var model = {
      kind:"linear", v:v, labels:[], heads:[], cells:[],
      W: GUT + COLS*(CELL+GAP) - GAP,
      H: LBL + ROWS*(CELL+GAP) - GAP
    };
    var monthLbl = {}, w, d, dt, kk;
    for(w=0; w<53; w++){
      for(d=0; d<7; d++){
        dt = new Date(start); dt.setDate(start.getDate()+w*7+d);
        kk = dkey(dt);
        if(dt.getDate()===1) monthLbl[w] = MONTHS[dt.getMonth()];
        var col0 = v ? d : w, row0 = v ? w : d;
        var off = dt.getFullYear()!==YEAR;
        var future = !off && kk>tk;
        var dist = daily[kk]||0;
        var lvl = levelOf(dist, future, off);
        model.cells.push({
          x: GUT + col0*(CELL+GAP), y: LBL + row0*(CELL+GAP),
          lvl: lvl, color: colorFor(lvl,future,off), delay: cellDelay(row0,col0,0),
          tip: tipOf(kk,dist,future,off)
        });
      }
    }
    for(var wk in monthLbl){
      var i = +wk;
      model.labels.push(v
        ? { x:0, y:LBL+i*(CELL+GAP), w:GUT-7, align:"right", text:monthLbl[wk] }
        : { x:GUT+i*(CELL+GAP), y:0, w:CELL+GAP, align:"left", text:monthLbl[wk] });
    }
    for(var di=1; di<=5; di+=2){
      model.labels.push(v
        ? { x:GUT+di*(CELL+GAP), y:3, w:CELL+GAP, align:"center", text:DAYS[di] }
        : { x:0, y:LBL+di*(CELL+GAP), w:GUT-7, align:"right", text:DAYS[di] });
    }
    return model;
  }

  // ---- DOM render ----
  function render(){
    var board = document.getElementById("board");
    var model = (mode==="blocks") ? buildBlocks() : buildLinear();
    currentModel = model;

    var html = "", i;
    if(model.kind==="blocks"){
      for(i=0;i<model.heads.length;i++){
        var hd = model.heads[i];
        html += '<div class="mhead" style="left:'+hd.x+'px;top:'+hd.y+'px;width:'+hd.w+'px">'+
                  '<span class="mname">'+hd.name+'</span><span class="mkm">'+hd.km+'</span></div>';
      }
    }else{
      for(i=0;i<model.labels.length;i++){
        var lb = model.labels[i];
        html += '<div class="lab" style="left:'+lb.x+'px;top:'+lb.y+'px;width:'+lb.w+'px;text-align:'+
                lb.align+'">'+lb.text+'</div>';
      }
    }
    for(i=0;i<model.cells.length;i++){
      var c = model.cells[i];
      html += '<div class="cell" data-tip="'+c.tip+'" style="left:'+c.x+'px;top:'+c.y+'px;width:'+CELL+
              'px;height:'+CELL+'px;background:'+c.color+';animation-delay:'+c.delay.toFixed(2)+'s'+
              (c.lvl>=2 && C.glow[c.lvl] ? ';--glow:'+C.glow[c.lvl] : '')+'"></div>';
    }
    board.style.width  = model.W+"px";
    board.style.height = model.H+"px";
    board.innerHTML = html;
    fitScale();
    renderStats();
  }
  function fitScale(){
    var stage = document.getElementById("stage"), scaler = document.getElementById("scaler");
    var board = document.getElementById("board");
    var natW = parseFloat(board.style.width);
    var s = Math.min(1, stage.clientWidth/natW);
    scaler.style.transform = "scale("+s+")";
    scaler.style.height = (parseFloat(board.style.height)*s)+"px";
    scaler.style.width  = (natW*s)+"px";
  }

  function statsText(){
    var total = 0, active = 0, k;
    for(k in daily){ total += daily[k]; active++; }
    var km = (total/1000).toLocaleString("en-US",{minimumFractionDigits:1, maximumFractionDigits:1});
    return { km:km, active:active };
  }
  function renderStats(){
    var s = statsText();
    document.getElementById("stats").innerHTML =
      "<b>"+s.km+" km</b><i>·</i><b>"+s.active+"</b> run days";
  }
  function renderLegend(){
    var items = [
      ["rest",  C.empty,    null],
      ["< 5km", C.levels[0], C.glow[0]],
      ["5-10km",C.levels[1], C.glow[1]],
      ["10-20km",C.levels[2],C.glow[2]],
      ["> 20km",C.levels[3], C.glow[3]]
    ];
    var html = '<span class="lessmore">DIM</span>';
    items.forEach(function(it){
      html += '<span class="item"><span class="dot" style="background:'+it[1]+
              (it[2] ? ';box-shadow:'+it[2] : '')+'"></span>'+it[0]+'</span>';
    });
    html += '<span class="lessmore">BRIGHT</span>';
    document.getElementById("legend").innerHTML = html;
  }

  // ---- tooltip ----
  var tip = document.getElementById("tip");
  document.getElementById("board").addEventListener("mousemove", function(e){
    var t = e.target;
    if(t && t.classList && t.classList.contains("cell")){
      var raw = t.getAttribute("data-tip").split("|");
      var tail = raw[1]==="out" ? "out of range"
               : raw[1]==="future" ? "future"
               : (+raw[1]>0) ? '<span class="km">'+(raw[1]/1000).toFixed(1)+" km</span>" : "rest";
      tip.innerHTML = raw[0]+" · "+tail;
      tip.style.display = "block";
      tip.style.left = e.clientX+"px";
      tip.style.top  = e.clientY+"px";
    }else{ tip.style.display = "none"; }
  });
  document.getElementById("board").addEventListener("mouseleave", function(){ tip.style.display="none"; });

  /* ================= GIF EXPORT ================= */
  function hex2rgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
  function mix(a,b,t){ return [Math.round(a[0]+(b[0]-a[0])*t), Math.round(a[1]+(b[1]-a[1])*t), Math.round(a[2]+(b[2]-a[2])*t)]; }

  function buildPalette(){
    var pal = [];
    function add(rgb){
      for(var i=0;i<pal.length;i++) if(pal[i][0]===rgb[0]&&pal[i][1]===rgb[1]&&pal[i][2]===rgb[2]) return;
      pal.push(rgb);
    }
    var base = ["#09090b","#131316","#27272a","#1f1f23", C.off, C.empty].concat(C.levels)
               .concat(["#52525b","#71717a","#a1a1aa","#d4d4d8","#f4f4f5","#ffffff","#dc2626","#f87171"]);
    base.forEach(function(h){ add(hex2rgb(h)); });
    var bg = hex2rgb("#09090b"), white = hex2rgb("#f4f4f5"), red = hex2rgb("#dc2626"), i;
    for(i=1;i<=7;i++) add(mix(bg, white, i/8));        // grey ramp for anti-aliased text
    for(i=1;i<=3;i++) add(mix(bg, red, i/4));          // red ramp for the title
    while(pal.length < 32) pal.push([0,0,0]);          // pad to a power of two
    return pal.slice(0,32);
  }

  function makeMapper(pal){
    var cache = new Map();
    return function(r,g,b){
      var key = (r<<16)|(g<<8)|b;
      var hit = cache.get(key);
      if(hit!==undefined) return hit;
      var best = 0, bd = 1e9;
      for(var i=0;i<pal.length;i++){
        var p = pal[i], dr = r-p[0], dg = g-p[1], db = b-p[2];
        var d = dr*dr*3 + dg*dg*4 + db*db*2;           // cheap perceptual weighting
        if(d<bd){ bd=d; best=i; }
      }
      cache.set(key,best);
      return best;
    };
  }

  // --- minimal GIF89a + LZW encoder ---
  function lzwEncode(indices, minCodeSize){
    var clear = 1<<minCodeSize, eoi = clear+1;
    var next = eoi+1, size = minCodeSize+1;
    var table = new Map();
    var bytes = [], cur = 0, curBits = 0;
    function emit(code){
      cur |= code << curBits; curBits += size;
      while(curBits>=8){ bytes.push(cur & 255); cur >>= 8; curBits -= 8; }
    }
    emit(clear);
    var prev = indices[0];
    for(var i=1;i<indices.length;i++){
      var k = indices[i], key = prev*256 + k, val = table.get(key);
      if(val===undefined){
        emit(prev);
        if(next===4096){
          emit(clear); table = new Map(); next = eoi+1; size = minCodeSize+1;
        }else{
          if(next >= (1<<size)) size++;
          table.set(key, next++);
        }
        prev = k;
      }else prev = val;
    }
    emit(prev); emit(eoi);
    if(curBits>0) bytes.push(cur & 255);
    return bytes;
  }

  function encodeGif(frames, w, h, pal, delayCs){
    var out = [], i, j, k;
    function u8(v){ out.push(v & 255); }
    function u16(v){ out.push(v & 255, (v>>8) & 255); }
    function asc(s){ for(var z=0;z<s.length;z++) out.push(s.charCodeAt(z)&255); }
    var bits = Math.round(Math.log(pal.length)/Math.LN2) - 1;   // 32 -> 4
    var minCode = bits + 1;
    asc("GIF89a"); u16(w); u16(h); u8(0x80 | bits); u8(0); u8(0);
    for(i=0;i<pal.length;i++){ u8(pal[i][0]); u8(pal[i][1]); u8(pal[i][2]); }
    out.push(0x21,0xFF,11); asc("NETSCAPE2.0"); out.push(3,1); u16(0); out.push(0);
    for(i=0;i<frames.length;i++){
      out.push(0x21,0xF9,4,0x04); u16(delayCs); u8(0); u8(0);
      out.push(0x2C); u16(0); u16(0); u16(w); u16(h); u8(0);
      u8(minCode);
      var data = lzwEncode(frames[i], minCode);
      for(j=0;j<data.length;j+=255){
        var n = Math.min(255, data.length-j);
        u8(n);
        for(k=0;k<n;k++) u8(data[j+k]);
      }
      out.push(0);
    }
    out.push(0x3B);
    return new Uint8Array(out);
  }

  function gifLayout(model){
    var PAD = 24;
    var W = Math.max(model.W + PAD*2, 300);
    return {
      PAD:PAD, W:W,
      titleY: PAD + 26,
      statsY: PAD + 50,
      boardX: Math.round((W - model.W)/2),
      boardY: PAD + 84,
      H: PAD + 84 + model.H + 46
    };
  }

  function drawFrame(ctx, model, L, t){
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#09090b";
    ctx.fillRect(0,0,L.W,L.H);

    // title
    ctx.textBaseline = "alphabetic";
    ctx.font = 'italic 900 30px system-ui, "Segoe UI", sans-serif';
    ctx.textAlign = "left";
    ctx.fillStyle = "#f4f4f5"; ctx.fillText("RUNNING", L.PAD, L.titleY);
    var w1 = ctx.measureText("RUNNING").width;
    ctx.fillStyle = "#dc2626"; ctx.fillText(".2026", L.PAD + w1, L.titleY);

    // stats
    ctx.font = '13px ui-monospace, Menlo, monospace';
    ctx.fillStyle = "#a1a1aa";
    var st = statsText();
    ctx.fillText(st.km+" km  ·  "+st.active+" run days", L.PAD, L.statsY);

    // board
    ctx.save();
    ctx.translate(L.boardX, L.boardY);
    var i, c;
    if(model.kind==="blocks"){
      for(i=0;i<model.heads.length;i++){
        var hd = model.heads[i];
        var a = (t - hd.delay)/0.35;
        if(a<=0) continue;
        if(a>1) a = 1;
        ctx.globalAlpha = a;
        ctx.strokeStyle = "#1f1f23"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(hd.x, hd.y+14.5); ctx.lineTo(hd.x+hd.w, hd.y+14.5); ctx.stroke();
        ctx.font = '700 11px ui-monospace, Menlo, monospace';
        ctx.fillStyle = "#d4d4d8"; ctx.textAlign = "left";
        ctx.fillText(hd.name, hd.x, hd.y+11);
        ctx.font = '9px ui-monospace, Menlo, monospace';
        ctx.fillStyle = "#52525b"; ctx.textAlign = "right";
        ctx.fillText(hd.km, hd.x+hd.w, hd.y+11);
      }
    }else{
      ctx.font = '7px ui-monospace, Menlo, monospace';
      ctx.fillStyle = "#52525b";
      for(i=0;i<model.labels.length;i++){
        var lb = model.labels[i];
        ctx.textAlign = lb.align==="right" ? "right" : (lb.align==="center" ? "center" : "left");
        var lx = lb.align==="right" ? lb.x+lb.w : (lb.align==="center" ? lb.x+lb.w/2 : lb.x);
        ctx.fillText(lb.text, lx, lb.y+8);
      }
    }
    for(i=0;i<model.cells.length;i++){
      c = model.cells[i];
      var p = (t - c.delay)/POP;
      if(p<=0) continue;
      if(p>1) p = 1;
      var e = 1 - Math.pow(1-p, 3);                 // ease-out, close to CSS
      var s = CELL * e, o = (CELL - s)/2;
      ctx.globalAlpha = e;
      ctx.fillStyle = c.color;
      if(c.lvl===3){ ctx.shadowColor = "rgba(255,224,102,.85)"; ctx.shadowBlur = 7; }
      else if(c.lvl===2){ ctx.shadowColor = "rgba(255,140,26,.7)"; ctx.shadowBlur = 4; }
      ctx.fillRect(c.x+o, c.y+o, s, s);
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.restore();

    // legend
    if(L.W >= 330){
      var items = [["no run",C.empty],["< 5km",C.levels[0]],["5-10km",C.levels[1]],["10-20km",C.levels[2]],["> 20km",C.levels[3]]];
      var la = t/0.4; if(la>1) la = 1;
      ctx.globalAlpha = Math.max(0, la);
      ctx.font = '10px ui-monospace, Menlo, monospace';
      var total = 0, widths = [];
      for(i=0;i<items.length;i++){
        var wd = ctx.measureText(items[i][0]).width + 17;
        widths.push(wd); total += wd + 12;
      }
      total -= 12;
      var lx2 = Math.round((L.W - total)/2), ly = L.boardY + model.H + 28;
      for(i=0;i<items.length;i++){
        ctx.fillStyle = items[i][1];
        if(i===4){ ctx.shadowColor = "rgba(255,224,102,.85)"; ctx.shadowBlur = 7; }
        else if(i===3){ ctx.shadowColor = "rgba(255,140,26,.7)"; ctx.shadowBlur = 4; }
        ctx.fillRect(lx2, ly-8, 10, 10);
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#d4d4d8"; ctx.textAlign = "left";
        ctx.fillText(items[i][0], lx2+15, ly);
        lx2 += widths[i] + 12;
      }
      ctx.globalAlpha = 1;
    }
  }

  var gifBusy = false;
  function exportGif(){
    if(gifBusy || !currentModel) return;
    var btn = document.getElementById("gifBtn");
    var model = currentModel, L = gifLayout(model);
    var canvas = document.createElement("canvas");
    canvas.width = L.W; canvas.height = L.H;
    var ctx = canvas.getContext("2d", {alpha:false});
    var pal = buildPalette(), map = makeMapper(pal);

    var maxDelay = 0;
    for(var i=0;i<model.cells.length;i++) if(model.cells[i].delay>maxDelay) maxDelay = model.cells[i].delay;
    var dur = maxDelay + POP + 0.35;
    var fps = 10, n = Math.min(80, Math.round(dur*fps));

    gifBusy = true; btn.disabled = true;
    var frames = [], f = 0;
    function step(){
      var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
      var now = t0;
      while(f < n && (now - t0) < 40){
        drawFrame(ctx, model, L, f/fps);
        var img = ctx.getImageData(0,0,L.W,L.H).data;
        var idx = new Uint8Array(L.W*L.H);
        for(var p=0, q=0; p<img.length; p+=4, q++) idx[q] = map(img[p], img[p+1], img[p+2]);
        frames.push(idx);
        f++;
        now = (window.performance && performance.now) ? performance.now() : Date.now();
      }
      btn.textContent = "生成中 " + f + "/" + n;
      if(f < n){ setTimeout(step, 0); return; }
      var gif = encodeGif(frames, L.W, L.H, pal, Math.round(100/fps));
      var url = URL.createObjectURL(new Blob([gif], {type:"image/gif"}));
      var a = document.createElement("a");
      a.href = url; a.download = "running-2026-"+mode+".gif"; a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      gifBusy = false; btn.disabled = false; btn.textContent = "⬇ 导出 GIF";
    }
    setTimeout(step, 0);
  }

  // ---- controls ----
  var NEXT = { blocks:["v","↓ 纵向一览"], v:["h","→ 横向一览"], h:["blocks","⊞ 宫格视图"] };
  var viewBtn = document.getElementById("viewBtn");
  function syncBtn(){ viewBtn.textContent = NEXT[mode][1]; }
  viewBtn.addEventListener("click", function(){ mode = NEXT[mode][0]; syncBtn(); render(); });
  document.getElementById("replayBtn").addEventListener("click", render);
  document.getElementById("gifBtn").addEventListener("click", exportGif);
  window.addEventListener("resize", fitScale);

  // ---- data loading (live fetch, embedded snapshot as fallback) ----
  function setDailyFromList(arr){
    var m = {}, i;
    for(i=0;i<arr.length;i++){
      var ds = String(arr[i].start_date_local||"").slice(0,10);
      if(ds.slice(0,4)===String(YEAR)) m[ds] = (m[ds]||0)+(arr[i].distance||0);
    }
    if(Object.keys(m).length) daily = m;
  }
  function boot(){
    try{ daily = JSON.parse(document.getElementById("fallback-data").textContent); }catch(e){ daily = {}; }
    render(); renderLegend(); syncBtn();
    fetch(DATA_URL+"?t="+Date.now())
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(arr){ setDailyFromList(arr); render(); })
      .catch(function(){ /* keep snapshot */ });
  }
  boot();
})();
</script>
